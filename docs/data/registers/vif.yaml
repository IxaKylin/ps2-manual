  - name: VIF0_FIFO
    addr: 0x10004000
    width: 128
    access: WO
    brief: VIF0 FIFO 写入口
    desc: >-
      VIF0 的 FIFO 入口，窗口 0x10004000–0x10004FFF。DMAC 通道 0 把数据送到这里；EE 也可以直接
      写入 VIFcode 和数据。QEMU 接受 32 位和 64 位写入（64 位写入按低字、高字顺序拆为两个字），
      写入窗口内任一地址效果相同；读出为 0。
    source: ["PCSX2 pcsx2/Hw.h:170", "ps2tek §EE Map", "QEMU hw/display/ps2_vif.c（vif_fifo_write）", "QEMU hw/mips/ps2_ee.c"]

  - name: VIF1_FIFO
    addr: 0x10005000
    width: 128
    access: WO
    brief: VIF1 FIFO 写入口
    desc: >-
      VIF1 的 FIFO 入口，窗口 0x10005000–0x10005FFF，行为同 VIF0_FIFO。硬件上 STAT.FDR = 1 时
      可从此处读出 GS 送回的数据；QEMU 不支持经 FIFO 读出，GS 到主存的传输只能经 DMAC 通道 1 完成。
    source: ["PCSX2 pcsx2/Hw.h:171", "ps2tek §EE Map", "QEMU hw/display/ps2_vif.c（vif_fifo_read）", "QEMU hw/mips/ps2_ee.c"]
