    source: ["PCSX2 pcsx2/GS/GSRegs.h:685", "ps2tek §GS Register List"]

  - name: TEXA
    offset: 0x3B
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_TEXA）"
    status: reference
    brief: 16 / 24 位纹理展开为 RGBA32 时的 α 值
    desc: >-
      TA0（第 7:0 位）：PSMCT24 纹素及最高位为 0 的 PSMCT16 纹素的 α；AEM（第 15 位）：为 1 时 RGB 全 0 的纹素 α 取 0；
      TA1（第 39:32 位）：最高位为 1 的 PSMCT16 纹素的 α。CLUT 项为 16 位格式时同样适用。
    notes:
      - QEMU 已实现，但没有测试覆盖。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_to_rgba）", "PCSX2 pcsx2/GS/GSRegs.h:871（GIFRegTEXA）"]

  - name: FOGCOL
    offset: 0x3D
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_FOGCOL）"
    status: reference
    brief: 雾颜色
    desc: FCR（第 7:0 位）、FCG（第 15:8 位）、FCB（第 23:16 位）。
    notes:
      - QEMU 已实现，但没有测试覆盖。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_fog）", "PCSX2 pcsx2/GS/GSRegs.h:646", "ps2tek §GS Fog"]

  - name: TEXFLUSH
    offset: 0x3F
    access: WO
    status: unimplemented
    brief: 使纹理缓存失效
    desc: 写入任意值使纹理缓存失效。更新纹理或 CLUT 数据后、把帧缓冲当作纹理之前应写本寄存器。QEMU 没有纹理缓存，写入只保存，不影响结果。
    source: ["PCSX2 pcsx2/GS/GSRegs.h:888", "ps2tek §GS Textures"]

  - name: SCISSOR_1
    offset: 0x40
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_SCISSOR_1）"
    brief: 上下文 1 裁剪矩形（窗口坐标）
    desc: >-
      窗口坐标中的裁剪矩形，边界包含在内；矩形外的像素不进入像素流水线。SCISSOR_2（0x41）为上下文 2 的同名寄存器。
    fields:
      - { bits: "10:0", name: SCAX0, reset: 0, desc: "左边界 X" }
      - { bits: "26:16", name: SCAX1, reset: 0, desc: "右边界 X（含）" }
      - { bits: "42:32", name: SCAY0, reset: 0, desc: "上边界 Y" }
      - { bits: "58:48", name: SCAY1, reset: 0, desc: "下边界 Y（含）" }
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context、ps2_gs_clip）", "PCSX2 pcsx2/GS/GSRegs.h:753", "ps2tek §GS Tests and Pixel Control"]

  - name: SCISSOR_2
    offset: 0x41
    access: WO
    reset: "0x0000000000000000"
    nodetail: true
    check: "GS 一般寄存器无总线地址；GS_SCISSOR_1 + 1"
    brief: 上下文 2 裁剪矩形，格式同 SCISSOR_1
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context）"]

  - name: ALPHA_1
    offset: 0x42
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_ALPHA_1）"
    brief: 上下文 1 α 混合公式选择
    desc: >-
      α 混合公式为 Cv = ((A − B) × C >> 7) + D，A、B、D 为颜色，C 为 α 值。Cs 为源（片元）颜色，Cd 为帧缓冲中的颜色。
      ALPHA_2（0x43）为上下文 2 的同名寄存器。
    fields:
      - name: A
        bits: "1:0"
        reset: 0
        desc: 被减数颜色
        values: { "0": "Cs", "1": "Cd", "2": "0", "3": "保留" }
      - { bits: "3:2", name: B, reset: 0, desc: "减数颜色，取值同 A" }
      - name: C
        bits: "5:4"
        reset: 0
        desc: 系数 α
        values: { "0": "As（源 α）", "1": "Ad（帧缓冲 α）", "2": "FIX", "3": "保留" }
      - { bits: "7:6", name: D, reset: 0, desc: "加数颜色，取值同 A" }
      - { bits: "39:32", name: FIX, reset: 0, desc: "C = 2 时使用的固定 α 值，0x80 表示 1.0" }
    notes:
      - ps2tek 把 FIX 写在第 15:8 位；PCSX2 与 QEMU 均为第 39:32 位，本手册按后者。
      - QEMU 中取值 3 按 2 处理。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_blend）", "PCSX2 pcsx2/GS/GSRegs.h:521（GIFRegALPHA）", "ps2tek §GS Alpha Blending"]

  - name: ALPHA_2
    offset: 0x43
    access: WO
    reset: "0x0000000000000000"
    nodetail: true
    check: "GS 一般寄存器无总线地址；GS_ALPHA_1 + 1"
    brief: 上下文 2 α 混合公式选择，格式同 ALPHA_1
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context）"]

  - name: DIMX
    offset: 0x44
    access: WO
    status: unimplemented
    brief: 4 × 4 抖动矩阵
    desc: 16 个 3 位有符号抖动值 DMxy，每个占 4 位（第 2:0 位有效）。DTHE = 1 时按像素位置加到颜色上。QEMU 只保存。
    source: ["PCSX2 pcsx2/GS/GSRegs.h:590（GIFRegDIMX）", "PCSX2 pcsx2/GS/Renderers/SW/GSDrawScanline.cpp:1580"]

  - name: DTHE
    offset: 0x45
    access: WO
    status: unimplemented
    brief: 抖动允许
    desc: 第 0 位 DTHE：1 = 写入 PSMCT16 帧缓冲时按 DIMX 抖动。QEMU 不做抖动，只保存。
    source: ["PCSX2 pcsx2/GS/GSRegs.h:625（GIFRegDTHE）", "PCSX2 pcsx2/GS/Renderers/SW/GSDrawScanline.cpp:1580"]

  - name: COLCLAMP
    offset: 0x46
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_COLCLAMP）"
    status: reference
    brief: α 混合结果的钳位方式
    desc: 第 0 位 CLAMP：1 = 各颜色分量钳位到 0–255，0 = 只取低 8 位（回绕）。
    notes:
      - QEMU 已实现，但没有测试覆盖。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_blend）", "PCSX2 pcsx2/GS/GSRegs.h:584", "ps2tek §GS Alpha Blending"]

  - name: TEST_1
    offset: 0x47
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_TEST_1）"
    brief: 上下文 1 像素测试：α 测试、目的 α 测试、深度测试
    desc: TEST_2（0x48）为上下文 2 的同名寄存器。各测试的顺序见 9.6 节。
    fields:
      - { bits: "0", name: ATE, reset: 0, desc: "1 = α 测试允许" }
      - name: ATST
        bits: "3:1"
        reset: 0
        desc: α 测试方式（片元 α 与 AREF 比较，满足条件为通过）
        values: { "0": "NEVER", "1": "ALWAYS", "2": "LESS（<）", "3": "LEQUAL（≤）", "4": "EQUAL（=）", "5": "GEQUAL（≥）", "6": "GREATER（>）", "7": "NOTEQUAL（≠）" }
      - { bits: "11:4", name: AREF, reset: 0, desc: "α 参考值" }
      - name: AFAIL
        bits: "13:12"
        reset: 0
        desc: α 测试失败时的处理
        values: { "0": "KEEP：帧缓冲与 Z 缓冲都不更新", "1": "FB_ONLY：只更新帧缓冲", "2": "ZB_ONLY：只更新 Z 缓冲", "3": "RGB_ONLY：只更新帧缓冲的 RGB" }
      - { bits: "14", name: DATE, reset: 0, desc: "1 = 目的 α 测试允许" }
      - { bits: "15", name: DATM, reset: 0, desc: "目的 α 测试方式：0 = 帧缓冲像素 α 最高位为 0 的通过，1 = 为 1 的通过" }
      - { bits: "16", name: ZTE, reset: 0, desc: "1 = 深度测试允许。QEMU 中 ZTE = 0 时既不测试也不写 Z 缓冲" }
      - name: ZTST
        bits: "18:17"
        reset: 0
        desc: 深度测试方式
        values: { "0": "NEVER", "1": "ALWAYS", "2": "GEQUAL（Z ≥ Z 缓冲）", "3": "GREATER（Z > Z 缓冲）" }
    notes:
      - GS 的深度比较是“大者在前”，清 Z 缓冲时写 0。
      - PCSX2 在帧缓冲不是 32 位格式（FRAME.PSM 低 4 位不为 0，如 PSMCT24、PSMCT16）时把 AFAIL = 3（RGB_ONLY）按 1（FB_ONLY）处理（pcsx2/GS/GSRegs.h:786，GetAFAIL）；QEMU 不做这一转换。
      - ps2tek 注明 ZTE = 0 可能属于禁止用法（原文带问号）；需要关闭深度测试时，稳妥的写法是 ZTE = 1、ZTST = 1（ALWAYS）。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_fragment、ps2_gs_alpha_test）", "PCSX2 pcsx2/GS/GSRegs.h:774（GIFRegTEST）", "PCSX2 pcsx2/GS/GSRegs.h:176（GS_ZTST）", "ps2tek §GS Tests and Pixel Control"]

  - name: TEST_2
    offset: 0x48
    access: WO
    reset: "0x0000000000000000"
    nodetail: true
    check: "GS 一般寄存器无总线地址；GS_TEST_1 + 1"
    brief: 上下文 2 像素测试，格式同 TEST_1
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context）"]

  - name: PABE
    offset: 0x49
    access: WO
    status: unimplemented
    brief: 按像素 α 控制 α 混合
    desc: 第 0 位 PABE：1 = 源 α 最高位为 0 的像素不做 α 混合。QEMU 只保存。
    source: ["PCSX2 pcsx2/GS/GSRegs.h:699（GIFRegPABE）", "PCSX2 pcsx2/GS/Renderers/SW/GSDrawScanline.cpp:1518"]

  - name: FBA_1
    offset: 0x4A
    access: WO
    status: unimplemented
    brief: 上下文 1 写入帧缓冲时 α 最高位强制置 1
    desc: 第 0 位 FBA：1 = 写入帧缓冲前把 α 的最高位置 1（PSMCT24 无 α，不受影响）。FBA_2（0x4B）为上下文 2 的同名寄存器。QEMU 只保存。
    source: ["PCSX2 pcsx2/GS/GSRegs.h:631（GIFRegFBA）", "PCSX2 pcsx2/GS/Renderers/SW/GSDrawScanline.cpp:1596"]

  - name: FBA_2
    offset: 0x4B
    access: WO
    status: unimplemented
    nodetail: true
    brief: 上下文 2 α 最高位强制置 1，格式同 FBA_1
    source: ["PCSX2 pcsx2/GS/GSRegs.h:631", "ps2tek §GS Register List"]

  - name: FRAME_1
    offset: 0x4C
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_FRAME_1）"
    brief: 上下文 1 帧缓冲设置
    desc: 绘图目标帧缓冲的地址、宽度、格式与写屏蔽。FRAME_2（0x4D）为上下文 2 的同名寄存器。
    fields:
      - { bits: "8:0", name: FBP, reset: 0, desc: "帧缓冲起始地址，单位为页（2048 字 = 8 KB）" }
      - { bits: "21:16", name: FBW, reset: 0, desc: "缓冲宽度，单位为 64 像素。Z 缓冲使用同一宽度" }
      - name: PSM
        bits: "29:24"
        reset: 0
        desc: 帧缓冲像素格式
        values: { "0x00": "PSMCT32", "0x01": "PSMCT24", "0x02": "PSMCT16", "0x0A": "PSMCT16S", "0x30": "PSMZ32", "0x31": "PSMZ24", "0x32": "PSMZ16", "0x3A": "PSMZ16S" }
      - { bits: "63:32", name: FBMSK, reset: 0, desc: "写屏蔽，为 1 的位不更新（按 RGBA32 位置给出，16 位格式时取对应分量的高位）" }
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context、ps2_gs_fragment）", "PCSX2 pcsx2/GS/GSRegs.h:653（GIFRegFRAME）", "ps2tek §GS Frame and Z Buffers"]

  - name: FRAME_2
    offset: 0x4D
    access: WO
    reset: "0x0000000000000000"
    nodetail: true
    check: "GS 一般寄存器无总线地址；GS_FRAME_1 + 1"
    brief: 上下文 2 帧缓冲设置，格式同 FRAME_1
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context）"]

  - name: ZBUF_1
    offset: 0x4E
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_ZBUF_1）"
    brief: 上下文 1 Z 缓冲设置
    desc: Z 缓冲的地址、格式与写屏蔽，宽度与 FRAME 相同。ZBUF_2（0x4F）为上下文 2 的同名寄存器。
    fields:
      - { bits: "8:0", name: ZBP, reset: 0, desc: "Z 缓冲起始地址，单位为页" }
      - name: PSM
        bits: "27:24"
        reset: 0
        desc: Z 格式（PSMZ 编码的低 4 位）
        values: { "0x0": "PSMZ32", "0x1": "PSMZ24", "0x2": "PSMZ16", "0xA": "PSMZ16S" }
      - { bits: "32", name: ZMSK, reset: 0, desc: "1 = 不更新 Z 缓冲（只测试）" }
    notes:
      - 写入 Z 缓冲前，QEMU 把 Z 钳位到格式能表示的最大值（PSMZ24 为 0xFFFFFF，PSMZ16/16S 为 0xFFFF）。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context、ps2_gs_z_max）", "PCSX2 pcsx2/GS/GSRegs.h:949（GIFRegZBUF）", "ps2tek §GS Frame and Z Buffers"]

  - name: ZBUF_2
    offset: 0x4F
    access: WO
    reset: "0x0000000000000000"
    nodetail: true
    check: "GS 一般寄存器无总线地址；GS_ZBUF_1 + 1"
    brief: 上下文 2 Z 缓冲设置，格式同 ZBUF_1
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_context）"]

  - name: BITBLTBUF
    offset: 0x50
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_BITBLTBUF）"
    brief: 传输的源 / 目的缓冲设置
    desc: >-
      主机 ↔ 本地、本地 → 本地传输的缓冲。主机 → 本地只用目的部分，本地 → 主机只用源部分，
      本地 → 本地两者都用，且源与目的格式的每像素位数必须相同。
    fields:
      - { bits: "13:0", name: SBP, reset: 0, desc: "源缓冲起始地址，单位为块（64 字 = 256 字节）" }
      - { bits: "21:16", name: SBW, reset: 0, desc: "源缓冲宽度，单位为 64 像素" }
      - { bits: "29:24", name: SPSM, reset: 0, desc: "源像素格式，见表 9-4" }
      - { bits: "45:32", name: DBP, reset: 0, desc: "目的缓冲起始地址，单位为块" }
      - { bits: "53:48", name: DBW, reset: 0, desc: "目的缓冲宽度，单位为 64 像素" }
      - { bits: "61:56", name: DPSM, reset: 0, desc: "目的像素格式，见表 9-4" }
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_transfer_pixel、ps2_gs_transfer_local）", "PCSX2 pcsx2/GS/GSRegs.h:545（GIFRegBITBLTBUF）", "ps2tek §GS Transfers"]

  - name: TRXPOS
    offset: 0x51
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_TRXPOS）"
    brief: 传输矩形左上角与本地 → 本地的传输顺序
    fields:
      - { bits: "10:0", name: SSAX, reset: 0, desc: "源矩形左上角 X（像素）" }
      - { bits: "26:16", name: SSAY, reset: 0, desc: "源矩形左上角 Y" }
      - { bits: "42:32", name: DSAX, reset: 0, desc: "目的矩形左上角 X" }
      - { bits: "58:48", name: DSAY, reset: 0, desc: "目的矩形左上角 Y" }
      - name: DIR
        bits: "60:59"
        reset: 0
        desc: 本地 → 本地传输的像素顺序，用于源与目的区域重叠的情况
        values: { "0": "左上 → 右下", "1": "左下 → 右上", "2": "右上 → 左下", "3": "右下 → 左上" }
    notes:
      - 坐标超过 2047 时按 2048 回绕。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_transfer_local）", "PCSX2 pcsx2/GS/GSRegs.h:899（GIFRegTRXPOS）", "ps2tek §GS Transfers"]

  - name: TRXREG
    offset: 0x52
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_TRXREG）"
    brief: 传输矩形的宽与高
    fields:
      - { bits: "11:0", name: RRW, reset: 0, desc: "宽度（像素）" }
      - { bits: "43:32", name: RRH, reset: 0, desc: "高度（像素）" }
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_start_transfer）", "PCSX2 pcsx2/GS/GSRegs.h:912", "ps2tek §GS Transfers"]

  - name: TRXDIR
    offset: 0x53
    access: WO
    reset: "0x0000000000000000"
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_TRXDIR）"
    brief: 传输方向；写入即启动传输
    desc: 写入时按 BITBLTBUF、TRXPOS、TRXREG 的当前值启动传输，因此必须最后写。
    fields:
      - name: XDIR
        bits: "1:0"
        reset: 0
        desc: 传输方向
        values: { "0": "主机 → 本地（随后经 IMAGE 包或 HWREG 送数据）", "1": "本地 → 主机（经 VIF1 / DMAC 通道 1 读出）", "2": "本地 → 本地（写入时立即完成）", "3": "停止传输" }
    notes:
      - QEMU 中格式编码无效、宽或高为 0 时不启动传输；本地 → 本地源与目的每像素位数不同时记录 LOG_GUEST_ERROR 并放弃。
    source: ["QEMU hw/display/ps2_gs.c（ps2_gs_start_transfer）", "PCSX2 pcsx2/GS/GSRegs.h:893", "ps2tek §GS Transfers"]

  - name: HWREG
    offset: 0x54
    access: WO
    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_HWREG）"
    status: reference
    brief: 主机 → 本地传输的数据端口
    desc: 主机 → 本地传输进行中时，每次写入的 64 位按目的格式拆成像素依次写入本地存储器。IMAGE 模式 GIF 数据包是写 HWREG 的快捷方式。没有进行中的传输时写入被忽略。
    notes:
