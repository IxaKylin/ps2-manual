    brief: 上下文 2 mipmap 第 1–3 级，格式同 MIPTBP1_1
    source: ["PCSX2 pcsx2/GS/GSRegs.h:675", "ps2tek §GS Register List"]

  - name: MIPTBP2_1
    offset: 0x36
    access: WO
    status: unimplemented
    brief: 上下文 1 mipmap 第 4–6 级纹理地址与宽度
    desc: 格式同 MIPTBP1_1，对应第 4、5、6 级。QEMU 只保存。
