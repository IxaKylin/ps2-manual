    check: "GS 一般寄存器无总线地址，offset 为寄存器地址（ps2_gs.c GS_SIGNAL）"
    brief: 更新 SIGLBLID.SIGID 并产生 SIGNAL 事件
    desc: 第 31:0 位 ID，第 63:32 位 IDMSK。SIGID = (SIGID & ~IDMSK) | (ID & IDMSK)，然后置 CSR.SIGNAL。
