  - name: SIO2_ISTAT
    addr: 0x1F808280
    offset: 0x80
    access: R/W1C
    reset: 0x00000000
    brief: 中断状态（写 1 清零）
    desc: >-
      SIO2 中断状态。传输完成时 TR_COMP 置 1，同时向 IOP INTC 发出第 17 号中断。SIO2MAN 的中断处理程序
      读出该寄存器后把读出值写回，以清除状态位。QEMU 中只有 ISTAT 为 0 时启动传输才会发出中断脉冲，
      因此必须清除 TR_COMP 后才能收到下一次中断。
    fields:
      - { bits: "0", name: TR_COMP, access: R/W1C, reset: 0, desc: 传输完成 }
      - { bits: "1", name: TR_ERR, access: R/W1C, reset: 0, status: unimplemented, desc: "传输出错（任一错误）。QEMU 从不置位" }
      - { bits: "31:2", name: 未知, reset: 0, status: unimplemented, desc: 含义不明 }
