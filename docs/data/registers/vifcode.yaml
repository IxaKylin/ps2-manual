# VIFcode：VIF 数据流中的命令字。VIFcode 位于 DMA 数据或 FIFO 写入的数据流中，
# 没有总线地址。格式说明见 docs/data/SCHEMA.md。
block: vifcode
title: VIFcode
page: /chapters/07-vpu
bus: 数据流中的数据结构
width: 32
status: verified
qemu:
  files: [hw/display/ps2_vif.c, include/hw/display/ps2_vif.h]
registers:
  - name: VIFcode
    check: VIFcode 为数据流中的命令字，无总线地址
    brief: VIF 命令字的通用格式
    desc: >-
      VIF 把收到的数据流按 32 位字处理：不在某条 VIFcode 的数据之中的字即为 VIFcode。
      CMD 决定命令类型，NUM 与 IMMEDIATE 的含义随命令而定。带数据的命令（STMASK、STROW、
      STCOL、MPG、DIRECT、DIRECTHL、UNPACK）之后紧跟其数据，数据收完后的下一个字又是 VIFcode。
      CMD 的取值及 QEMU 支持情况见第 7 章表 7-6。
    fields:
      - { bits: "15:0", name: IMMEDIATE, desc: 立即数，含义随命令而定 }
      - { bits: "23:16", name: NUM, desc: 数据量，含义随命令而定；MPG、UNPACK 中 0 表示 256 }
      - name: CMD
        bits: "30:24"
        desc: 命令码。0x60–0x7F 为 UNPACK，低 5 位另有含义（见 VIFcode_UNPACK）。
        values:
          "0x00": "NOP：不操作"
          "0x01": "STCYCL：CYCLE = IMMEDIATE"
          "0x02": "OFFSET（仅 VIF1）：OFST = IMMEDIATE[9:0]，DBF = 0，TOPS = BASE"
          "0x03": "BASE（仅 VIF1）：BASE = IMMEDIATE[9:0]"
          "0x04": "ITOP：ITOPS = IMMEDIATE[9:0]"
          "0x05": "STMOD：MODE = IMMEDIATE[1:0]"
          "0x06": "MSKPATH3（仅 VIF1）：IMMEDIATE 第 15 位屏蔽 PATH3。QEMU 按 NOP 处理"
          "0x07": "MARK：MARK = IMMEDIATE，STAT.MRK = 1"
          "0x10": "FLUSHE：等待微程序结束"
          "0x11": "FLUSH（仅 VIF1）：等待微程序结束且 PATH1、PATH2 空闲"
          "0x13": "FLUSHA（仅 VIF1）：同 FLUSH，并等待 PATH3 无传输请求"
          "0x14": "MSCAL：从 IMMEDIATE（指令对地址）启动微程序"
          "0x15": "MSCALF：同 MSCAL，并等待 PATH1、PATH2 空闲（ps2tek 列为仅 VIF1）"
          "0x17": "MSCNT：从 TPC 继续执行微程序"
          "0x20": "STMASK：其后 1 个字写入 MASK"
          "0x30": "STROW：其后 4 个字写入 R0–R3"
          "0x31": "STCOL：其后 4 个字写入 C0–C3"
          "0x4A": "MPG：其后 NUM 个指令对（NUM × 8 字节）写入微程序存储器 IMMEDIATE × 8 处"
          "0x50": "DIRECT（仅 VIF1）：其后 IMMEDIATE 个四字经 PATH2 送往 GIF，0 表示 65536"
          "0x51": "DIRECTHL（仅 VIF1）：同 DIRECT，但不打断 PATH3 的 IMAGE 传输"
          "0x60–0x7F": "UNPACK：解压数据写入 VU 数据存储器"
      - name: i
        bits: "31"
        status: unimplemented
        desc: 中断位。为 1 时该 VIFcode 执行后产生 VIF 中断（INTC 第 4/5 位），并在下一条 VIFcode（MARK 除外）处停顿，除非 ERR.MII = 1。QEMU 忽略此位，按其余位处理命令。
    notes:
      - 表中未列出的 CMD 为无效 VIFcode。QEMU 记录 LOG_GUEST_ERROR 后丢弃该字，不置 STAT.ER1。
      - QEMU 在 VIF0 上把 OFFSET、BASE、MSKPATH3、FLUSH、FLUSHA、DIRECT、DIRECTHL 当作无效 VIFcode 丢弃（DIRECT/DIRECTHL 的数据随后被当作 VIFcode 解释）。MSCALF 在 QEMU 的 VIF0 上照常启动微程序。
      - QEMU 中 VIFcode 一经收到即执行完毕：FLUSHE、FLUSH、FLUSHA 不需要等待，MSCAL/MSCALF/MSCNT 同步运行微程序直到结束。
    source: ["ps2tek §VIF Commands", "PCSX2 pcsx2/Vif_Codes.cpp:128-731（vifCode_*）", "QEMU hw/display/ps2_vif.c（vif_command）"]

  - name: VIFcode_UNPACK
    offset: 0x60
    check: CMD 值，无总线地址
    brief: UNPACK 命令（CMD = 0x60–0x7F）的位域
    desc: >-
      UNPACK 把其后的压缩数据按 VN/VL 指定的格式展开为 32 位 × 4 的四字，写入 VU 数据存储器，
      起始四字地址为 ADDR（VIF1 中 FLG = 1 时加上 TOPS）。写入地址序列由 CYCLE.CL/WL 决定，
      每个字段写什么由 m 位、MASK 与 MODE 决定，见 7.5 节。数据量为
      ⌈（实际取数据的四字个数）× 每个向量的位数 / 32⌉ 个字。
    fields:
      - { bits: "9:0", name: ADDR, desc: VU 数据存储器中的起始四字地址（字节地址 = ADDR × 16），按存储器大小回绕 }
      - { bits: "13:10", name: 保留, desc: 写 0 }
      - name: USN
        bits: "14"
        status: reference
        desc: 位宽为 8 位或 16 位的元素的扩展方式。QEMU 已实现，但没有测试覆盖。
        values: { "0": "符号扩展", "1": "零扩展" }
      - { bits: "15", name: FLG, desc: 仅 VIF1。为 1 时起始地址加上 TOPS（双缓冲）。VIF0 忽略此位 }
      - { bits: "23:16", name: NUM, desc: 写入的四字个数（含补写的四字），0 表示 256 }
      - name: VL
        bits: "25:24"
        desc: 元素位宽。
        values: { "0": "32 位", "1": "16 位", "2": "8 位", "3": "5 位（仅与 VN = 3 组合为 V4-5）" }
      - name: VN
        bits: "27:26"
        desc: 每个向量的元素个数。
        values: { "0": "S：1 个元素，复制到 x、y、z、w", "1": "V2：2 个元素", "2": "V3：3 个元素", "3": "V4：4 个元素" }
      - name: m
        bits: "28"
        status: reference
        desc: 屏蔽写入。为 1 时按 MASK 寄存器决定各字段的写入内容；为 0 时所有字段写入解压数据。QEMU 已实现，但没有测试覆盖。
      - { bits: "30:29", name: CMD, desc: 固定为 0b11 }
      - { bits: "31", name: i, status: unimplemented, desc: 中断位，同 VIFcode }
    notes:
      - qtest 只覆盖 V4-32 且 CL = WL = 1 的 UNPACK；其他格式、USN、MASK、MODE 与补写 QEMU 已实现，但没有测试覆盖（表 7-6）。
      - QEMU 中 VL = 3 时不论 VN 取何值都按 V4-5 处理（每向量 16 位）；硬件上只有 VN = 3、VL = 3 有效。
      - V2 的 z、w 与 V3 的 w 在 ps2tek 中为不确定值；QEMU 中 V2 把 x、y 重复到 z、w，V3 的 w 取数据流中下一个元素。程序不应依赖这些值。
      - V4-5 把 16 位 RGBA5551 展开为 R、G、B 各左移 3 位、A 左移 7 位，与 USN 无关。
    source: ["ps2tek §VIF Commands", "ps2tek §VIF UNPACK", "PCSX2 pcsx2/Vif_Codes.cpp:731（vifCode_Unpack）", "QEMU hw/display/ps2_vif.c（vif_unpack、vif_unpack_words）"]
