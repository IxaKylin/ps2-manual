# IOP DMA 控制器寄存器。格式说明见 docs/data/SCHEMA.md。
#
# 通道寄存器对 13 个通道写法相同，这里只描述一次，名称写作 Dn_xxx，
# offset 为相对于通道基地址的偏移（通道基地址见第 12 章表 12-5）。
# 全局寄存器给出绝对地址；其 offset 为相对于所在组基地址
# （第一组 0x1F801080，第二组 0x1F801500）的偏移，与 QEMU 头文件中的
# PS2_IOP_DMA_xxx 常量一致。本块不写 base。
block: iop-dma
title: IOP DMA 控制器
page: /chapters/12-iop
bus: IOP 总线
access_size: 8、16 或 32 位；窄读取出相应字节，窄写与其余字节合并
width: 32
status: verified
qemu:
  files: [include/hw/dma/ps2_iop_dma.h, hw/dma/ps2_iop_dma.c, hw/mips/ps2_iop.c]
registers:
  - name: Dn_MADR
    offset: 0x00
    access: R/W
    reset: 0x00000000
    brief: 传输的 IOP 内存地址，n = 0–12
    desc: >-
      IOP 内存一侧的传输地址（字节地址，按字对齐）。传输过程中随数据递增；链模式下由标签装入。
    fields:
      - { bits: "23:0", name: ADDR, reset: 0, desc: IOP 内存地址 }
      - { bits: "31:24", name: 保留, reset: 0, desc: 写入时写 0 }
    notes:
      - QEMU 保存写入的全部 32 位，不屏蔽第 31:24 位；SIF 通道从标签装入 MADR 时取低 24 位。
    source: ["PCSX2 pcsx2/IopHw.h:77-92", "ps2tek §IOP DMA", "QEMU hw/dma/ps2_iop_dma.c"]

  - name: Dn_BCR
    offset: 0x04
    access: R/W
    reset: 0x00000000
    brief: 块大小（字）与块数
    desc: >-
      低 16 位为每块的字数，高 16 位为块数。切片模式下每传输一块后可让出总线，总传输量为
      块大小 × 块数个字；突发模式只使用低 16 位。链模式（SIF0/SIF1）不使用 BCR，长度由标签给出。
    fields:
      - { bits: "15:0", name: SIZE, reset: 0, desc: "块大小，单位为字（32 位）。ps2tek 记为 0 表示 0x10000" }
      - { bits: "31:16", name: COUNT, reset: 0, desc: 块数 }
    notes:
      - QEMU 在传输开始时一次性读出 BCR，不在传输中递减。SPU2（通道 4/7）传输 COUNT × SIZE 个字；SIO2（通道 11/12）每块 SIZE × 4 字节，共 COUNT 块。
      - QEMU 中 SIZE = 0 按 0 处理，不按 0x10000 处理。
    source: ["PCSX2 pcsx2/IopHw.h:186-201（bcr_lower / bcr_upper）", "ps2tek §IOP DMA", "QEMU hw/audio/ps2_spu2.c、hw/misc/ps2_sio2.c"]

  - name: Dn_CHCR
    offset: 0x08
    access: R/W
    reset: 0x00000000
    brief: 通道控制（方向、同步模式、启动）
    desc: >-
      设定传输方向与同步模式，并以 START 位启动通道。START 写 1 时，若 DPCR/DPCR2 中该通道的允许位为 1，
      通道开始传输；传输结束时 DMA 控制器将 START 清零，并按 DICR/DICR2 置结束标志。
    fields:
      - name: DIR
        bits: "0"
        reset: 0
        desc: 传输方向
        values: { "0": "外设 → IOP 内存（to RAM）", "1": "IOP 内存 → 外设（from RAM）" }
      - { bits: "1", name: DEC, reset: 0, status: unimplemented, desc: 地址步进方向，为 1 时 MADR 每步减 4。QEMU 只保存，地址总是递增 }
      - { bits: "7:2", name: 保留, reset: 0, desc: 写入时写 0 }
      - name: TAG
        bits: "8"
        reset: 0
        desc: >-
          链模式下为 1 时先传送标签后附带的 2 个字（SIF0 用它把 EE 一侧的 DMAtag 送入 FIFO）；突发模式下 ps2tek
          称其为“切分（chopping）”允许。QEMU 只在 SIF0/SIF1 上使用此位，未置位时记录 LOG_UNIMP
      - name: SYNC
        bits: "10:9"
        reset: 0
        desc: 同步（传输）模式。QEMU 的 SPU2 与 SIO2 只支持切片模式（1），其他值记录 LOG_UNIMP 且不传输；SIF 通道不检查此位域
        values: { "0": "突发（Burst），只用 BCR 低 16 位", "1": "切片（Slice），按 BCR 分块", "2": "链表（Linked-list）", "3": "链模式（Chain），使用 TADR" }
      - { bits: "15:11", name: 保留, reset: 0, desc: "第 11 位 ps2tek 记为 i.LINK DMA 所用，含义不明。写入时写 0" }
      - { bits: "18:16", name: DMAW, reset: 0, status: unimplemented, desc: "切分模式下 DMA 一次占用的字数，为 1 << N。QEMU 不模拟" }
      - { bits: "19", name: 保留, reset: 0, desc: 写入时写 0 }
      - { bits: "22:20", name: CPUW, reset: 0, status: unimplemented, desc: "切分模式下让给 CPU 的周期数，为 1 << N。QEMU 不模拟" }
      - { bits: "23", name: 保留, reset: 0, desc: 写入时写 0 }
      - name: START
        bits: "24"
        reset: 0
        desc: 启动 / 忙。写 1 启动通道，传输进行中读出为 1，结束后清零。写 0 使 QEMU 认为通道已停止
        values: { "0": "停止 / 已完成", "1": "启动 / 传输中" }
      - { bits: "27:25", name: 保留, reset: 0, desc: 写入时写 0 }
      - { bits: "28", name: FORCE, reset: 0, status: unimplemented, desc: 不等待外设 DREQ 强制开始传输。QEMU 中传输总是立即开始 }
      - { bits: "29", name: PAUSE, reset: 0, status: unimplemented, desc: 强制突发时暂停传输等（ps2tek）。QEMU 不模拟 }
      - { bits: "30", name: SNOOP, reset: 0, status: unimplemented, desc: 总线侦听（ps2tek 推测与读 IOP 缓存有关）。QEMU 不模拟 }
      - { bits: "31", name: ILINK, reset: 0, status: unimplemented, desc: i.LINK 自动应答，用途不明。QEMU 不模拟 }
    ops:
      - SIF0 发送（IOP → EE）：写 D9_TADR = 标签链地址，再写 D9_CHCR = 0x01000101（START、TAG、DIR = 1）。
      - SIF1 接收（EE → IOP）：写 D10_CHCR = 0x01000100（START、TAG、DIR = 0），等待 EE 一侧 DMAC 通道 6 送来数据。
      - SPU2 core0 写入声音存储器：写 D4_MADR、D4_BCR（COUNT << 16 | SIZE），再写 D4_CHCR = 0x01000201（START、SYNC = 1、DIR = 1）。
    notes:
      - QEMU 只在 START 由“通道未运行”变为 1 时启动；通道已在运行时再写 START = 1 不会重新启动（PCSX2 每次写都会再次执行）。
      - DPCR 允许位为 0 时写 START = 1，START 保持为 1 但通道不启动；之后写 DPCR 置允许位也不会启动该通道，需要重新写 CHCR。
      - 没有接外设的通道（0、1、2、3、5、6、8）启动后立即结束，并记录 LOG_UNIMP。
    source: ["PCSX2 pcsx2/IopHw.h:172-184（DmaExec）", "ps2tek §IOP DMA", "QEMU hw/dma/ps2_iop_dma.c（ps2_iop_dma_write）", "QEMU tests/qtest/ps2-test.c（test_iop_dma、test_sif_dma）"]

  - name: Dn_TADR
    offset: 0x0C
    access: R/W
    reset: 0x00000000
    brief: 标签链地址（链模式）
    desc: >-
      链模式下第一个标签的 IOP 内存地址。DMA 控制器每读入一个标签就把 TADR 加上标签长度
      （2 字，或 CHCR.TAG = 1 时 4 字）。按 ps2tek，只有 SIF0、SIF1 与 SPU（通道 4）可以使用链模式。
    fields:
      - { bits: "23:0", name: ADDR, reset: 0, desc: 标签地址 }
      - { bits: "31:24", name: 保留, reset: 0, desc: 写入时写 0 }
    notes:
      - QEMU 中只有 SIF0（通道 9）使用 TADR：按 TADR & 0xFFFFFF 读 4 字的标签，每个标签后 TADR 加 16。
    source: ["PCSX2 pcsx2/IopHw.h:130-145", "ps2tek §IOP DMA", "QEMU hw/misc/ps2_sif.c"]

  - name: DPCR
    addr: 0x1F8010F0
    offset: 0x70
    access: R/W
    reset: 0x07777777
    brief: 通道 0–6 的优先级与允许位
    desc: >-
      每 4 位对应一个通道：低 3 位为优先级（0 最高），第 3 位为通道允许。第 31:28 位对应 CPU 的优先级。
      通道 n（0–6）的允许位为第 4n+3 位。
    fields:
      - { bits: "2:0", name: PRI0, reset: 7, status: unimplemented, desc: 通道 0（MDECin）优先级 }
      - { bits: "3", name: EN0, reset: 0, desc: 通道 0 允许 }
      - { bits: "6:4", name: PRI1, reset: 7, status: unimplemented, desc: 通道 1（MDECout）优先级 }
      - { bits: "7", name: EN1, reset: 0, desc: 通道 1 允许 }
      - { bits: "10:8", name: PRI2, reset: 7, status: unimplemented, desc: 通道 2（SIF2）优先级 }
      - { bits: "11", name: EN2, reset: 0, desc: 通道 2 允许 }
      - { bits: "14:12", name: PRI3, reset: 7, status: unimplemented, desc: 通道 3（CDVD）优先级 }
      - { bits: "15", name: EN3, reset: 0, desc: 通道 3 允许 }
      - { bits: "18:16", name: PRI4, reset: 7, status: unimplemented, desc: 通道 4（SPU2 core0）优先级 }
      - { bits: "19", name: EN4, reset: 0, desc: 通道 4 允许 }
      - { bits: "22:20", name: PRI5, reset: 7, status: unimplemented, desc: 通道 5（PIO）优先级 }
      - { bits: "23", name: EN5, reset: 0, desc: 通道 5 允许 }
      - { bits: "26:24", name: PRI6, reset: 7, status: unimplemented, desc: 通道 6（OTC）优先级 }
      - { bits: "27", name: EN6, reset: 0, desc: 通道 6 允许 }
      - { bits: "30:28", name: PRIC, reset: 0, status: unimplemented, desc: CPU 优先级 }
      - { bits: "31", name: 保留, reset: 0, desc: 无作用 }
    ops:
      - 允许通道 n：DPCR |= 8 << (4 × n)，用“读—改—写”方式，以免改动其他通道。
    notes:
      - QEMU 保存全部 32 位，只使用 ENn 位；优先级无作用（传输立即完成，不存在仲裁）。
      - 复位值 0x07777777 来自 ps2tek（PS1 复位值为 0x07654321）。
    source: ["ps2tek §IOP DMA", "PCSX2 pcsx2/IopHw.h:172-177", "QEMU hw/dma/ps2_iop_dma.c"]

  - name: DICR
    addr: 0x1F8010F4
    offset: 0x74
    access: R/W
    reset: 0x00000000
    brief: 通道 0–6 的中断屏蔽与结束标志；DMA 中断总开关
    desc: >-
      第 22:16 位为通道 0–6 的中断屏蔽，第 30:24 位为结束标志（写 1 清零），第 23 位为两组通道共用的
      中断总允许，第 31 位为只读的中断请求标志。第 31 位为 1 时 IOP INTC 第 3 位（DMA）置位。
    fields:
      - { bits: "6:0", name: SLICE_IE, reset: 0, status: unimplemented, desc: "为 1 时通道 0–6 每传完一个切片或链表块都产生中断，为 0 时只在整个传输结束时产生。QEMU 只保存" }
      - { bits: "14:7", name: 保留, reset: 0, desc: 写入时写 0 }
      - { bits: "15", name: BERR, reset: 0, desc: "总线错误标志。ps2tek：传输地址超出 IOP 内存时置 1。为 1 时强制 DICR.31 = 1。QEMU 不会自动置位，但写入的值同样强制中断" }
      - { bits: "22:16", name: MASK, reset: 0, desc: 通道 0–6 中断屏蔽，第 16+n 位为 1 时通道 n 结束后置结束标志 }
      - { bits: "23", name: MASTER, reset: 0, desc: DMA 中断总允许，同时作用于 DICR 与 DICR2 的结束标志 }
      - { bits: "30:24", name: FLAG, access: R/W1C, reset: 0, desc: 通道 0–6 结束标志，写 1 清零。只有屏蔽位为 1 的通道结束时才置位 }
      - { bits: "31", name: IRQ, access: RO, reset: 0, desc: "中断请求 = BERR || (MASTER && (DICR.FLAG || DICR2.FLAG))" }
    ops:
      - 初始化：写 DICR = 0x00800000（MASTER = 1），并按需置 MASKn。
      - 中断处理程序中读 DICR 与 DICR2，取 FLAG 中为 1 的位，处理后写回原值（低 24 位不变）清除这些标志。
    notes:
      - 写 DICR 时低 24 位直接写入，第 30:24 位写 1 清零、写 0 不变；第 31 位由硬件计算。
      - 窄写（8/16 位）与当前值合并时不会把读出的标志位重新写 1，因此不会误清其他通道的标志。
      - 结束标志只在屏蔽位为 1 时置位（ps2tek 注明 IOP 内核依赖此行为），通道 9/10（SIF0/SIF1）除外，见 DICR2。
    source: ["ps2tek §IOP DMA", "PCSX2 pcsx2/ps2/Iop/IopHwWrite.cpp:436-470", "PCSX2 pcsx2/IopHw.cpp:45-66", "QEMU hw/dma/ps2_iop_dma.c（ps2_iop_dma_irq_level、ps2_iop_dma_channel_done）"]

  - name: DPCR2
    addr: 0x1F801570
    offset: 0x70
    access: R/W
    reset: 0x07777777
    brief: 通道 7–12 的优先级与允许位
    desc: >-
      格式与 DPCR 相同，第 4k+3 位为通道 7+k 的允许位（k = 0–5）。第 27:24 位对应 USB 的 DMA
      （由 USB 寄存器控制），第 31:28 位用途不明。
    fields:
      - { bits: "2:0", name: PRI7, reset: 7, status: unimplemented, desc: 通道 7（SPU2 core1）优先级 }
      - { bits: "3", name: EN7, reset: 0, desc: 通道 7 允许 }
      - { bits: "6:4", name: PRI8, reset: 7, status: unimplemented, desc: 通道 8（DEV9）优先级 }
      - { bits: "7", name: EN8, reset: 0, desc: 通道 8 允许 }
      - { bits: "10:8", name: PRI9, reset: 7, status: unimplemented, desc: 通道 9（SIF0）优先级 }
      - { bits: "11", name: EN9, reset: 0, desc: 通道 9 允许 }
      - { bits: "14:12", name: PRI10, reset: 7, status: unimplemented, desc: 通道 10（SIF1）优先级 }
      - { bits: "15", name: EN10, reset: 0, desc: 通道 10 允许 }
      - { bits: "18:16", name: PRI11, reset: 7, status: unimplemented, desc: 通道 11（SIO2in）优先级 }
      - { bits: "19", name: EN11, reset: 0, desc: 通道 11 允许 }
      - { bits: "22:20", name: PRI12, reset: 7, status: unimplemented, desc: 通道 12（SIO2out）优先级 }
      - { bits: "23", name: EN12, reset: 0, desc: 通道 12 允许 }
      - { bits: "27:24", name: USB, reset: 7, status: unimplemented, desc: USB DMA 的优先级与允许。QEMU 的 USB OHCI 不经 IOP DMA 控制器 }
      - { bits: "31:28", name: 保留, reset: 0, desc: 用途不明 }
    notes:
      - 例如同时允许 SIF0 与 SIF1：DPCR2 |= 0x00008800。ps2-lite-bios 的 SIF 层即如此设置。
    source: ["ps2tek §IOP DMA", "PCSX2 pcsx2/IopHw.h:179-184", "QEMU hw/dma/ps2_iop_dma.c"]

  - name: DICR2
    addr: 0x1F801574
    offset: 0x74
    access: R/W
    reset: 0x00000000
    brief: 通道 7–12 的中断屏蔽与结束标志
    desc: >-
      第 21:16 位为通道 7–12 的中断屏蔽，第 29:24 位为结束标志（写 1 清零）。这些标志同样受 DICR.23
      （MASTER）控制，经 DICR.31 送往 IOP INTC 第 3 位。DICR2 没有自己的总允许位与中断请求位。
    fields:
      - { bits: "12:0", name: TAG_IE, reset: 0, status: unimplemented, desc: "标签 IRQ 中断允许，第 n 位对应通道 n，只有第 4、9、10 位可置 1。为 1 时 IRQ 位（第 30 位）为 1 的标签传完后产生中断。QEMU 只保存" }
      - { bits: "15:13", name: 保留, reset: 0, desc: 写入时写 0 }
      - { bits: "21:16", name: MASK, reset: 0, desc: 通道 7–12 中断屏蔽，第 16+k 位对应通道 7+k }
      - { bits: "23:22", name: 保留, reset: 0, desc: 写入时写 0。QEMU 保存写入值 }
      - { bits: "29:24", name: FLAG, access: R/W1C, reset: 0, desc: 通道 7–12 结束标志，写 1 清零 }
      - { bits: "31:30", name: 保留, reset: 0, desc: 读出为 0 }
    notes:
      - 通道 9（SIF0）与 10（SIF1）无论屏蔽位如何，结束时总置结束标志（第 26、27 位）；其他通道只在屏蔽位为 1 时置位。PCSX2 行为相同。
      - 读 DICR2 不含第 31 位的计算值，中断状态须读 DICR.31。
    source: ["ps2tek §IOP DMA", "PCSX2 pcsx2/IopHw.cpp:68-82", "QEMU hw/dma/ps2_iop_dma.c（ps2_iop_dma_channel_done）", "QEMU tests/qtest/ps2-test.c（test_iop_dma）"]

  - name: DMACEN
    addr: 0x1F801578
    offset: 0x78
    access: R/W
    reset: 0x00000000
    status: unimplemented
    brief: DMA 全局允许（仅第二组）
    desc: >-
      第 0 位为 0 时所有 DMA 传输被禁止，为 1 时允许。传输进行中也可以安全访问。
      ps2sdk 的 FlushIcache 在清除指令缓存前保存 DMACEN 并写 0，结束后写回原值。
    fields:
      - { bits: "0", name: EN, reset: 0, desc: 全局 DMA 允许 }
      - { bits: "31:1", name: 保留, access: RO, reset: 0, desc: QEMU 中读出为 0 }
    notes:
      - QEMU 只保存第 0 位（ps2/iop-dma 测试写 0xFFFFFFFF 读回 1），通道不受其控制。第一组的 +0x78 不是寄存器，读出为 0。
    source: ["ps2tek §IOP DMA", "ps2sdk common/include/iop_regs.h:236", "ps2sdk iop/system/loadcore/src/loadcore.c:1434-1438", "QEMU hw/dma/ps2_iop_dma.c"]

  - name: DMACINTEN
    addr: 0x1F80157C
    offset: 0x7C
    access: R/W
    reset: 0x00000000
    status: unimplemented
    brief: DMA 全局中断控制（仅第二组）
    desc: >-
      按 ps2tek：第 0 位为 0 时所有通道中断被禁止（总线错误除外）；第 1 位为 1 时 DMA 中断不送往 INTC，
      但不影响 DICR.31。ps2sdk 把该地址称为 DICR3。
    fields:
      - { bits: "0", name: CHIE, reset: 0, desc: 通道中断总允许 }
      - { bits: "1", name: IRQD, reset: 0, desc: 为 1 时不向 INTC 发出 DMA 中断 }
      - { bits: "31:2", name: 保留, reset: 0, desc: 写入时写 0。QEMU 保存写入值 }
    notes:
      - QEMU 保存全部 32 位，不影响中断。
    source: ["ps2tek §IOP DMA", "ps2sdk common/include/iop_regs.h:234", "QEMU hw/dma/ps2_iop_dma.c"]
