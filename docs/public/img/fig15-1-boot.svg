<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" width="960" height="1120" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>

  <rect width="960" height="1120" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 15-1 启动流程</text>
  <text x="24" y="54" class="s">竖向箭头：各处理器内的执行顺序；横跨 SIF 列的箭头：寄存器写入或 SIF DMA，箭头指向接收方。</text>
  <text x="24" y="68" class="s">注有“PCSX2”的地址取自 PCSX2，其余取自 QEMU 运行 SCPH-39001 BIOS 时的串口输出与跟踪记录。</text>

  <!-- lane backgrounds -->
  <rect x="24" y="122" width="260" height="986" fill="#f7fafd" stroke="#c9d9ec" stroke-width="1"/>
  <rect x="292" y="122" width="160" height="986" fill="#fafafb" stroke="#dcdee2" stroke-width="1"/>
  <rect x="460" y="122" width="260" height="986" fill="#f6fbf8" stroke="#c4e2cf" stroke-width="1"/>
  <rect x="740" y="122" width="196" height="986" fill="#faf7fd" stroke="#ddd0ee" stroke-width="1"/>

  <!-- lane headers -->
  <rect x="24" y="76" width="260" height="46" rx="8" class="ee"/>
  <text x="154" y="96" text-anchor="middle" class="h">EE（R5900）</text>
  <text x="154" y="113" text-anchor="middle" class="s">PRId = 0x2E20</text>
  <rect x="292" y="76" width="160" height="46" rx="8" fill="#f4f5f7" stroke="#3a4250" stroke-width="2"/>
  <text x="372" y="96" text-anchor="middle" class="h">SIF</text>
  <text x="372" y="113" text-anchor="middle" class="s">共用寄存器与 FIFO</text>
  <rect x="460" y="76" width="260" height="46" rx="8" class="iop"/>
  <text x="590" y="96" text-anchor="middle" class="h">IOP（R3000A）</text>
  <text x="590" y="113" text-anchor="middle" class="s">PRId = 0x1F</text>
  <rect x="740" y="76" width="196" height="46" rx="8" class="gfx"/>
  <text x="838" y="96" text-anchor="middle" class="h">CDVD / MechaCon</text>
  <text x="838" y="113" text-anchor="middle" class="s">IOP 0x1F402000</text>

  <!-- row A: reset -->
  <rect x="24" y="140" width="696" height="50" rx="6" class="blk" stroke="#3a4250"/>
  <text x="372" y="161" text-anchor="middle" class="n">复位：两颗 CPU 都从 0xBFC00000 执行 ROM0 开头的 RESET</text>
  <text x="372" y="180" text-anchor="middle" class="s">SR.BEV = 1，异常使用 0xBFC00xxx 引导向量</text>
  <rect x="740" y="140" width="196" height="50" rx="6" class="blk" stroke="#7a4bb3"/>
  <text x="752" y="161" class="n">MechaCon 独立运行</text>
  <text x="752" y="180" class="s">QEMU：复位时托盘关闭，无光盘</text>

  <line x1="372" y1="190" x2="372" y2="212" class="ln" marker-end="url(#a)"/>

  <!-- row B: PRId split -->
  <rect x="24" y="212" width="696" height="46" rx="6" class="blk" stroke="#3a4250"/>
  <text x="372" y="232" text-anchor="middle" class="n">RESET 读 CP0 第 15 号寄存器 PRId 分流</text>
  <text x="372" y="250" text-anchor="middle" class="s">EE 读出 0x2E20，IOP 读出 0x1F；Sony BIOS 以 0x59 为界（ps2tek），ps2-lite-bios 以 0x100 为界</text>

  <line x1="154" y1="258" x2="154" y2="300" class="ln" marker-end="url(#a)"/>
  <text x="162" y="284" class="s">EE：转到 0xBFC00800</text>
  <line x1="590" y1="258" x2="590" y2="300" class="ln" marker-end="url(#a)"/>
  <text x="582" y="284" text-anchor="end" class="s">IOP：转到 0xBFC02000</text>

  <!-- EE lane -->
  <rect x="24" y="300" width="260" height="64" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="321" class="h">EE 早期初始化</text>
  <text x="36" y="340" class="s">TLB 第 0 项映射暂存存储器 0x70000000</text>
  <text x="36" y="356" class="s">栈指针 sp = 0x70004000</text>
  <line x1="154" y1="364" x2="154" y2="384" class="ln" marker-end="url(#a)"/>

  <rect x="24" y="384" width="260" height="64" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="405" class="h">RDRAM 初始化（MCH）</text>
  <text x="36" y="424" class="s">InitRDRAM 经 MCH_RICM / MCH_DRD</text>
  <text x="36" y="440" class="s">串口：可用主存 32 MB</text>
  <line x1="154" y1="448" x2="154" y2="468" class="ln" marker-end="url(#a)"/>

  <rect x="24" y="468" width="260" height="80" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="489" class="h">EE 内核初始化</text>
  <text x="36" y="507" class="s">GS、INTC、TIMER、DMAC、VU1、VIF1、</text>
  <text x="36" y="523" class="s">GIF、VU0、VIF0、IPU、FPU、用户主存</text>
  <text x="36" y="539" class="s">串口：# Initialize Done.</text>
  <line x1="154" y1="548" x2="154" y2="568" class="ln" marker-end="url(#a)"/>

  <!-- IOP lane -->
  <rect x="460" y="300" width="260" height="64" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="321" class="h">IOPBOOT</text>
  <text x="472" y="340" class="s">ROM0 中的程序，入口 0xBFC4A000（PCSX2）</text>
  <text x="472" y="356" class="s">参数 a0 = IOP 内存 MB 数</text>
  <line x1="590" y1="364" x2="590" y2="384" class="ln" marker-end="url(#a)"/>

  <rect x="460" y="384" width="260" height="64" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="405" class="h">按 IOPBTCONF 加载模块</text>
  <text x="472" y="424" class="s">IOPBTCONF 每行一个模块名，按名</text>
  <text x="472" y="440" class="s">在 ROMDIR 中查找，依次链接并启动</text>
  <line x1="590" y1="448" x2="590" y2="468" class="ln" marker-end="url(#a)"/>

  <rect x="460" y="468" width="260" height="80" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="489" class="h">SIF 前的硬件初始化</text>
  <text x="472" y="507" class="s">SSBUS 时序、ICFG、DMA 第二组</text>
  <text x="472" y="523" class="s">缓存控制（0xFFFE0130）</text>
  <text x="472" y="539" class="s">然后循环读 MSFLAG</text>
  <line x1="590" y1="548" x2="590" y2="568" class="ln" marker-end="url(#a)"/>

  <!-- handshake -->
  <rect x="24" y="568" width="260" height="200" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="589" class="h">SIF 初始化与握手</text>
  <text x="36" y="616" class="s">写 CTRL、BD6、MAINADDR、MSFLAG</text>
  <text x="36" y="646" class="s">循环读 SMFLAG</text>
  <text x="36" y="736" class="s">读到 SMFLAG = 0x00070000</text>
  <text x="36" y="756" class="s">写 SMFLAG = 0x40000，清除 BOOTEND</text>

  <rect x="460" y="568" width="260" height="200" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="589" class="h">SIF 握手</text>
  <text x="472" y="616" class="s">等到 MSFLAG.SIFINIT = 1</text>
  <text x="472" y="646" class="s">写 CTRL = 0x40、SUBADDR = 0</text>
  <text x="472" y="676" class="s">置位 SIFINIT，再写 SUBADDR</text>
  <text x="472" y="706" class="s">依次置位 BOOTEND、CMDINIT</text>
  <text x="472" y="736" class="s">（跟踪中的写入顺序）</text>

  <line x1="284" y1="612" x2="460" y2="612" class="ln" marker-end="url(#a)"/>
  <text x="372" y="606" text-anchor="middle" class="b">MSFLAG ← SIFINIT</text>
  <line x1="460" y1="642" x2="284" y2="642" class="ln" marker-end="url(#a)"/>
  <text x="372" y="636" text-anchor="middle" class="b">① SMFLAG ← SIFINIT</text>
  <line x1="460" y1="672" x2="284" y2="672" class="ln" marker-end="url(#a)"/>
  <text x="372" y="666" text-anchor="middle" class="b">SUBADDR ← 0x19600</text>
  <line x1="460" y1="702" x2="284" y2="702" class="ln" marker-end="url(#a)"/>
  <text x="372" y="696" text-anchor="middle" class="b">② SMFLAG ← BOOTEND</text>
  <line x1="460" y1="732" x2="284" y2="732" class="ln" marker-end="url(#a)"/>
  <text x="372" y="726" text-anchor="middle" class="b">③ SMFLAG ← CMDINIT</text>

  <line x1="154" y1="768" x2="154" y2="788" class="ln" marker-end="url(#a)"/>
  <line x1="590" y1="768" x2="590" y2="788" class="ln" marker-end="url(#a)"/>

  <!-- SIF DMA -->
  <rect x="24" y="788" width="260" height="72" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="808" class="h">SIF DMA</text>
  <text x="36" y="830" class="s">DMAC 通道 6 发出 SIF1</text>
  <text x="36" y="852" class="s">DMAC 通道 5 接收 SIF0</text>
  <rect x="460" y="788" width="260" height="72" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="808" class="h">SIF DMA</text>
  <text x="472" y="830" class="s">IOP DMA 通道 10 接收 8 字</text>
  <text x="472" y="852" class="s">IOP DMA 通道 9 发出 6 字</text>
  <line x1="284" y1="826" x2="460" y2="826" class="ln" marker-end="url(#a)"/>
  <text x="372" y="820" text-anchor="middle" class="b">SIF1：8 字 → 0x19600</text>
  <line x1="460" y1="852" x2="284" y2="852" class="ln" marker-end="url(#a)"/>
  <text x="372" y="846" text-anchor="middle" class="b">SIF0：6 字 → 0x19870</text>

  <line x1="154" y1="860" x2="154" y2="880" class="ln" marker-end="url(#a)"/>
  <line x1="590" y1="860" x2="590" y2="880" class="ln" marker-end="url(#a)"/>

  <!-- EELOAD / EECONF -->
  <rect x="24" y="880" width="260" height="56" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="901" class="h">EELOAD</text>
  <text x="36" y="922" class="s">主存 0x82000 起（PCSX2）</text>
  <rect x="460" y="880" width="260" height="56" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="901" class="h">EECONF 读取配置</text>
  <text x="472" y="922" class="s">S 命令 0x40 / 0x41 / 0x43</text>
  <line x1="720" y1="908" x2="740" y2="908" class="ln" marker-end="url(#a)"/>
  <rect x="740" y="880" width="196" height="56" rx="6" class="blk" stroke="#7a4bb3"/>
  <text x="752" y="901" class="h">NVM 配置区</text>
  <text x="752" y="922" class="s">打开、按块读出、关闭</text>

  <line x1="154" y1="936" x2="154" y2="956" class="ln" marker-end="url(#a)"/>
  <line x1="590" y1="936" x2="590" y2="956" class="ln" marker-end="url(#a)"/>

  <!-- OSDSYS / modules -->
  <rect x="24" y="956" width="260" height="70" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="36" y="977" class="h">OSDSYS</text>
  <text x="36" y="997" class="s">EELOAD 无参数时启动 rom0:OSDSYS</text>
  <text x="36" y="1014" class="s">（PCSX2 的说明）</text>
  <rect x="460" y="956" width="260" height="70" rx="6" class="blk" stroke="#2e8b57"/>
  <text x="472" y="977" class="h">全部加载后再置 BOOTEND</text>
  <text x="472" y="997" class="s">随后注册 sio2man、padman、</text>
  <text x="472" y="1014" class="s">mcman、mcserv 等库</text>

  <line x1="154" y1="1026" x2="154" y2="1046" class="ln" marker-end="url(#a)"/>

  <rect x="24" y="1046" width="260" height="50" rx="6" class="ee"/>
  <text x="36" y="1067" class="h">OSDSYS 主菜单</text>
  <text x="36" y="1086" class="s">Browser / System Configuration</text>
  <rect x="740" y="1046" width="196" height="50" rx="6" class="ext"/>
  <text x="752" y="1067" class="n">无光盘</text>
  <text x="752" y="1086" class="s">停在主菜单，不启动游戏</text>
</svg>
