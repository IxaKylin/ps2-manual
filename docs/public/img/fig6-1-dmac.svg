<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 6-1 DMAC 与 10 个通道</text>
  <text x="24" y="58" class="s">箭头表示数据流向；双向箭头表示方向由 CHCR.DIR 选择。</text>
  <rect x="24" y="200" width="210" height="150" rx="12" class="mem"/>
  <text x="40" y="226" class="h">主存 RDRAM</text>
  <text x="40" y="248" class="n">32 MB</text>
  <text x="40" y="272" class="s">MADR / TADR 第 31 位 = 0</text>
  <text x="40" y="292" class="s">第 31 位 = 1 时指向 SPR</text>
  <text x="40" y="312" class="s">DMAtag 链表也放在这里</text>
  <path d="M236 275 H298" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="244" y="266" class="b">128 位</text>
  <rect x="300" y="72" width="270" height="480" rx="14" class="ee"/>
  <text x="316" y="96" class="h">DMAC（10 通道）</text>
  <rect x="312" y="110" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="130" class="b">ch0</text>
  <text x="360" y="130" class="n">VIF0</text>
  <text x="476" y="130" class="s">0x10008000</text>
  <rect x="660" y="110" width="280" height="30" rx="6" class="gfx"/>
  <text x="672" y="130" class="n">VIF0 FIFO → VU0</text>
  <path d="M560 125 H658" class="ln" marker-end="url(#a)"/>
  <rect x="312" y="150" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="170" class="b">ch1</text>
  <text x="360" y="170" class="n">VIF1</text>
  <text x="476" y="170" class="s">0x10009000</text>
  <rect x="660" y="150" width="280" height="30" rx="6" class="gfx"/>
  <text x="672" y="170" class="n">VIF1 FIFO ⇄ VU1 / GIF PATH2</text>
  <path d="M560 165 H658" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="312" y="190" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="210" class="b">ch2</text>
  <text x="360" y="210" class="n">GIF</text>
  <text x="476" y="210" class="s">0x1000A000</text>
  <rect x="660" y="190" width="280" height="30" rx="6" class="gfx"/>
  <text x="672" y="210" class="n">GIF FIFO（PATH3）→ GS</text>
  <path d="M560 205 H658" class="ln" marker-end="url(#a)"/>
  <rect x="312" y="230" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="250" class="b">ch3</text>
  <text x="360" y="250" class="n">fromIPU</text>
  <text x="476" y="250" class="s">0x1000B000</text>
  <rect x="660" y="230" width="280" height="30" rx="6" class="ee"/>
  <text x="672" y="250" class="n">IPU 输出 FIFO</text>
  <path d="M560 245 H658" class="ln" marker-start="url(#a)"/>
  <rect x="312" y="270" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="290" class="b">ch4</text>
  <text x="360" y="290" class="n">toIPU</text>
  <text x="476" y="290" class="s">0x1000B400</text>
  <rect x="660" y="270" width="280" height="30" rx="6" class="ee"/>
  <text x="672" y="290" class="n">IPU 输入 FIFO</text>
  <path d="M560 285 H658" class="ln" marker-end="url(#a)"/>
  <rect x="312" y="310" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="330" class="b">ch5</text>
  <text x="360" y="330" class="n">SIF0</text>
  <text x="476" y="330" class="s">0x1000C000</text>
  <rect x="660" y="310" width="280" height="30" rx="6" class="iop"/>
  <text x="672" y="330" class="n">SIF0 FIFO ← IOP DMA 9</text>
  <path d="M560 325 H658" class="ln" marker-start="url(#a)"/>
  <rect x="312" y="350" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="370" class="b">ch6</text>
  <text x="360" y="370" class="n">SIF1</text>
  <text x="476" y="370" class="s">0x1000C400</text>
  <rect x="660" y="350" width="280" height="30" rx="6" class="iop"/>
  <text x="672" y="370" class="n">SIF1 FIFO → IOP DMA 10</text>
  <path d="M560 365 H658" class="ln" marker-end="url(#a)"/>
  <rect x="312" y="390" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="410" class="b">ch7</text>
  <text x="360" y="410" class="n">SIF2</text>
  <text x="476" y="410" class="s">0x1000C800</text>
  <rect x="660" y="390" width="280" height="30" rx="6" class="iop"/>
  <text x="672" y="410" class="n">SIF2 FIFO ⇄ IOP DMA 2</text>
  <path d="M560 405 H658" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="312" y="430" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="450" class="b">ch8</text>
  <text x="360" y="450" class="n">fromSPR</text>
  <text x="476" y="450" class="s">0x1000D000</text>
  <rect x="660" y="430" width="280" height="30" rx="6" class="mem"/>
  <text x="672" y="450" class="n">SPR → 主存（SADR → MADR）</text>
  <path d="M560 445 H658" class="ln" marker-start="url(#a)"/>
  <rect x="312" y="470" width="246" height="30" rx="5" class="blk" stroke="#2f6fb2"/>
  <text x="322" y="490" class="b">ch9</text>
  <text x="360" y="490" class="n">toSPR</text>
  <text x="476" y="490" class="s">0x1000D400</text>
  <rect x="660" y="470" width="280" height="30" rx="6" class="mem"/>
  <text x="672" y="490" class="n">主存 → SPR（MADR → SADR）</text>
  <path d="M560 485 H658" class="ln" marker-end="url(#a)"/>
  <text x="316" y="526" class="s">全局寄存器 0x1000E000–0x1000E060</text>
  <text x="316" y="542" class="s">D_ENABLER/W 0x1000F520/0x1000F590</text>
  <path d="M435 552 V582" class="ln" marker-end="url(#a)"/>
  <rect x="300" y="584" width="270" height="54" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="312" y="606" class="h">R5900</text>
  <text x="312" y="626" class="s">D_STAT → INT1（IP3）；D_PCR → CPCOND0</text>
  <text x="660" y="526" class="s">外设一侧为各模块的 FIFO；SIF 经 IOP DMA</text>
  <text x="660" y="542" class="s">与 IOP 内存交换数据（第 11 章）。</text>
</svg>
