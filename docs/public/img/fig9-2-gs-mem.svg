<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="576" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 9-2 GS 本地存储器的组织</text>
  <text x="24" y="58" class="s">地址单位：页 = 8 KB（FBP、ZBP），块 = 256 B（TBP0、CBP、SBP、DBP）。块内的列结构 QEMU 未模拟。</text>
  <rect x="24" y="76" width="160" height="210" rx="10" class="mem"/>
  <text x="36" y="98" class="h">4 MB = 512 页</text>
  <rect x="40" y="108" width="128" height="34" rx="4" class="blk" stroke="#c07a1a"/>
  <text x="50" y="130" class="n">页 0</text>
  <text x="106" y="130" class="s">0x000000</text>
  <rect x="40" y="146" width="128" height="34" rx="4" class="blk" stroke="#c07a1a"/>
  <text x="50" y="168" class="n">页 1</text>
  <text x="106" y="168" class="s">0x002000</text>
  <rect x="40" y="236" width="128" height="34" rx="4" class="blk" stroke="#c07a1a"/>
  <text x="50" y="258" class="n">页 511</text>
  <text x="106" y="258" class="s">0x3FE000</text>
  <text x="98" y="212" class="n">⋮</text>
  <text x="250" y="104" class="s">一页 = 8 KB = 32 块（PSMCT32 的块排列，64 × 32 像素）</text>
  <rect x="250" y="120" width="352" height="144" class="mem"/>
  <rect x="250" y="120" width="44" height="36" class="blk" stroke="#c07a1a"/>
