  <rect x="558" y="228" width="44" height="36" class="blk" stroke="#c07a1a"/>
  <text x="573" y="251" class="n">31</text>
  <text x="250" y="284" class="s">格中数字为块号；每块 8 × 8 像素。QEMU 的块排列表与此相同。</text>
  <path d="M168 163 H248" class="ln" marker-end="url(#a)"/>
  <text x="660" y="104" class="s">一块 = 256 B = 4 列 × 64 B（PSMCT32：8 × 8 像素）</text>
  <rect x="660" y="120" width="276" height="144" class="ext"/>
  <rect x="660" y="120" width="276" height="36" class="blk" stroke="#8a8f96"/>
  <text x="672" y="143" class="s">列 0：64 B，第 0–1 行像素（8 × 2）</text>
  <rect x="660" y="156" width="276" height="36" class="blk" stroke="#8a8f96"/>
  <text x="672" y="179" class="s">列 1：64 B，第 2–3 行像素（8 × 2）</text>
  <rect x="660" y="192" width="276" height="36" class="blk" stroke="#8a8f96"/>
  <text x="672" y="215" class="s">列 2：64 B，第 4–5 行像素（8 × 2）</text>
  <rect x="660" y="228" width="276" height="36" class="blk" stroke="#8a8f96"/>
  <text x="672" y="251" class="s">列 3：64 B，第 6–7 行像素（8 × 2）</text>
  <path d="M602 192 H658" class="ln" marker-end="url(#a)"/>
  <text x="660" y="284" class="s">列内像素的交错顺序见 PCSX2，本手册不展开。</text>
  <text x="24" y="322" class="h">各像素格式的页尺寸（按比例绘制，单位：像素）</text>
  <rect x="40" y="340" width="64" height="32" class="mem"/>
  <path d="M48 340V372M56 340V372M64 340V372M72 340V372M80 340V372M88 340V372M96 340V372M40 348H104M40 356H104M40 364H104" stroke="#c07a1a" stroke-width="0.8" fill="none"/>
  <text x="40" y="494" class="n">PSMCT32/24、PSMZ32/24</text>
  <text x="40" y="512" class="s">页 64 × 32，块 8 × 8，8 × 4 块</text>
  <rect x="260" y="340" width="64" height="64" class="mem"/>
  <path d="M276 340V404M292 340V404M308 340V404M260 348H324M260 356H324M260 364H324M260 372H324M260 380H324M260 388H324M260 396H324" stroke="#c07a1a" stroke-width="0.8" fill="none"/>
  <text x="260" y="494" class="n">PSMCT16/16S、PSMZ16/16S</text>
  <text x="260" y="512" class="s">页 64 × 64，块 16 × 8，4 × 8 块</text>
  <rect x="480" y="340" width="128" height="64" class="mem"/>
  <path d="M496 340V404M512 340V404M528 340V404M544 340V404M560 340V404M576 340V404M592 340V404M480 356H608M480 372H608M480 388H608" stroke="#c07a1a" stroke-width="0.8" fill="none"/>
  <text x="480" y="494" class="n">PSMT8</text>
  <text x="480" y="512" class="s">页 128 × 64，块 16 × 16，8 × 4 块</text>
  <rect x="700" y="340" width="128" height="128" class="mem"/>
  <path d="M732 340V468M764 340V468M796 340V468M700 356H828M700 372H828M700 388H828M700 404H828M700 420H828M700 436H828M700 452H828" stroke="#c07a1a" stroke-width="0.8" fill="none"/>
  <text x="700" y="494" class="n">PSMT4</text>
  <text x="700" y="512" class="s">页 128 × 128，块 32 × 16，4 × 8 块</text>
  <text x="24" y="540" class="s">PSMT8H、PSMT4HL、PSMT4HH 沿用 PSMCT32 的页与块排列，数据存放在 32 位像素的第 31:24、27:24、31:28 位。</text>
  <text x="24" y="558" class="s">每页总是 8 KB；FBW / TBW 以 64 像素为单位，PSMT8 / PSMT4 的一页宽 128 像素，占 2 个单位。</text>
</svg>
