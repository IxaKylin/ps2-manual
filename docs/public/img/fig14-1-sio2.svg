<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 14-1 SIO2 数据通路</text>

  <!-- IOP 内存 -->
  <rect x="30" y="200" width="150" height="180" rx="6" class="mem"/>
  <text x="105" y="280" class="h" text-anchor="middle">IOP 内存</text>
  <text x="105" y="300" class="s" text-anchor="middle">命令数据 / 应答数据</text>

  <!-- IOP 程序 -->
  <rect x="240" y="100" width="150" height="100" rx="6" class="iop"/>
  <text x="315" y="140" class="h" text-anchor="middle">IOP 程序</text>
  <text x="315" y="160" class="s" text-anchor="middle">SIO2MAN 等模块</text>
  <text x="315" y="176" class="s" text-anchor="middle">写命令与端口设定</text>

  <!-- IOP DMA -->
  <rect x="240" y="230" width="150" height="50" rx="6" class="iop"/>
  <text x="315" y="252" class="n" text-anchor="middle">IOP DMA 通道 11</text>
  <text x="315" y="269" class="s" text-anchor="middle">SIO2in</text>
  <rect x="240" y="310" width="150" height="50" rx="6" class="iop"/>
  <text x="315" y="332" class="n" text-anchor="middle">IOP DMA 通道 12</text>
  <text x="315" y="349" class="s" text-anchor="middle">SIO2out</text>

  <!-- SIO2 -->
  <rect x="440" y="62" width="300" height="400" rx="8" class="iop"/>
  <text x="460" y="86" class="h">SIO2</text>
  <text x="720" y="86" class="s" text-anchor="end">0x1F808200</text>

  <rect x="460" y="100" width="260" height="44" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="590" y="120" class="n" text-anchor="middle">命令队列 SEND3[0]–[15]</text>
  <text x="590" y="136" class="s" text-anchor="middle">端口号、发送 / 接收字节数</text>

  <rect x="460" y="156" width="230" height="44" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="575" y="176" class="n" text-anchor="middle">端口设定 SEND1 / SEND2[0–3]</text>
  <text x="575" y="192" class="s" text-anchor="middle">ATT 时序、波特率、应答超时</text>

  <rect x="460" y="230" width="120" height="50" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="520" y="252" class="n" text-anchor="middle">DATAIN</text>
  <text x="520" y="269" class="s" text-anchor="middle">0x60，8 位</text>

  <rect x="460" y="310" width="120" height="50" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="520" y="332" class="n" text-anchor="middle">DATAOUT</text>
  <text x="520" y="349" class="s" text-anchor="middle">0x64，8 位</text>

  <rect x="610" y="230" width="110" height="130" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="665" y="288" class="n" text-anchor="middle">串行收发</text>
  <text x="665" y="306" class="n" text-anchor="middle">端口选择</text>

  <rect x="460" y="390" width="260" height="50" rx="4" class="blk" stroke="#2e8b57"/>
  <text x="590" y="411" class="n" text-anchor="middle">状态 RECV1–RECV3、ISTAT</text>
  <text x="590" y="428" class="s" text-anchor="middle">应答 / 错误状态、传输完成</text>

  <!-- 外设与中断 -->
  <rect x="790" y="200" width="150" height="60" rx="6" class="ext"/>
  <text x="865" y="224" class="n" text-anchor="middle">端口 0</text>
  <text x="865" y="243" class="s" text-anchor="middle">手柄、存储卡、多分插适配器</text>
  <rect x="790" y="300" width="150" height="60" rx="6" class="ext"/>
  <text x="865" y="324" class="n" text-anchor="middle">端口 1</text>
  <text x="865" y="343" class="s" text-anchor="middle">手柄、存储卡、多分插适配器</text>
  <rect x="790" y="390" width="150" height="50" rx="6" class="iop"/>
  <text x="865" y="411" class="n" text-anchor="middle">IOP INTC</text>
  <text x="865" y="428" class="s" text-anchor="middle">第 17 号中断</text>

  <!-- 连线 -->
  <path d="M390 122H460" class="ln" marker-end="url(#a)"/>
  <path d="M390 178H460" class="ln" marker-end="url(#a)"/>
  <path d="M180 255H240" class="ln" marker-end="url(#a)"/>
  <path d="M390 265H460" class="ln" marker-end="url(#a)"/>
  <path d="M460 345H390" class="ln" marker-end="url(#a)"/>
  <path d="M240 335H180" class="ln" marker-end="url(#a)"/>
  <path d="M580 255H610" class="ln" marker-end="url(#a)"/>
  <path d="M610 335H580" class="ln" marker-end="url(#a)"/>
  <path d="M665 200V230" class="ln" marker-end="url(#a)"/>
  <path d="M705 144V230" class="ln" marker-end="url(#a)"/>
  <path d="M390 190H425V322H460" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M425 242H460" class="ln" marker-end="url(#a)"/>
  <text x="395" y="222" class="b">PIO</text>
  <path d="M665 360V390" class="ln" marker-end="url(#a)"/>
  <path d="M720 245H790" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M720 330H790" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M720 415H790" class="ln" marker-end="url(#a)"/>

  <!-- 说明 -->
  <rect x="30" y="482" width="910" height="40" rx="4" class="ext"/>
  <text x="46" y="507" class="s">虚线框为外部设备。QEMU 中端口上没有外设：DATAOUT 读出 0xFF，SIO2out DMA 写入 0xFF，RECV1 报告“无设备”。</text>
</svg>
