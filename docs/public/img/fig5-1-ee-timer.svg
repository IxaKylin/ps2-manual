<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .dl{stroke:#8a8f96;stroke-width:2;fill:none;stroke-dasharray:5 3}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f96"/>
    </marker>
  </defs>
  <rect width="1120" height="580" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 5-1 EE 定时器通道结构</text>
  <text x="24" y="58" class="s">通道 n = 0–3，寄存器基址 0x10000000 + n × 0x800</text>

  <!-- clock sources -->
  <rect x="24" y="80" width="170" height="56" rx="8" class="ee"/>
  <text x="38" y="103" class="h">BUSCLK</text>
  <text x="38" y="123" class="s">EE 总线时钟 147.456 MHz</text>

  <rect x="224" y="148" width="96" height="44" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="236" y="166" class="h">÷16</text>
  <text x="236" y="183" class="s">9.216 MHz</text>
  <rect x="224" y="204" width="96" height="44" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="236" y="222" class="h">÷256</text>
  <text x="236" y="239" class="s">576 kHz</text>

  <rect x="24" y="254" width="170" height="56" rx="8" class="gfx"/>
  <text x="38" y="277" class="h">HBLNK</text>
  <text x="38" y="297" class="s">行消隐信号，来自 GS</text>

  <path d="M194 118 H380" class="ln" marker-end="url(#a)"/>
  <path d="M208 118 V226 H224" class="ln" marker-end="url(#a)"/>
  <path d="M208 170 H224" class="ln" marker-end="url(#a)"/>
  <path d="M320 170 H380" class="ln" marker-end="url(#a)"/>
  <path d="M320 226 H380" class="ln" marker-end="url(#a)"/>
  <path d="M194 282 H380" class="ln" marker-end="url(#a)"/>

  <!-- clock select multiplexer -->
  <polygon points="380,96 430,120 430,296 380,320" fill="#ffffff" stroke="#2f6fb2" stroke-width="2"/>
  <text x="388" y="122" class="s">0</text>
  <text x="388" y="174" class="s">1</text>
  <text x="388" y="230" class="s">2</text>
  <text x="388" y="286" class="s">3</text>
  <text x="383" y="340" class="b">CLKS</text>
  <path d="M430 208 H456" class="ln" marker-end="url(#a)"/>

  <!-- gate -->
  <rect x="456" y="166" width="130" height="84" rx="8" class="ext"/>
  <text x="468" y="190" class="h">门控逻辑</text>
  <text x="468" y="210" class="s">GATE / GATS / GATM</text>
  <text x="468" y="230" class="s">QEMU 未实现</text>
  <rect x="456" y="300" width="130" height="48" rx="8" class="ext"/>
  <text x="468" y="320" class="s">门控信号</text>
  <text x="468" y="337" class="s">HBLNK / VBLNK</text>
  <path d="M521 300 V250" class="dl" marker-end="url(#g)"/>

  <path d="M586 208 H640" class="ln" marker-end="url(#a)"/>
  <text x="598" y="200" class="b">CUE</text>

  <!-- counter -->
  <rect x="640" y="166" width="170" height="84" rx="8" class="ee"/>
  <text x="654" y="190" class="h">16 位计数器</text>
  <text x="654" y="210" class="n">COUNT</text>
  <text x="654" y="230" class="s">每个时钟加 1</text>

  <!-- compare -->
  <rect x="840" y="56" width="140" height="44" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="852" y="75" class="h">COMP</text>
  <text x="852" y="92" class="s">16 位比较值</text>
  <path d="M910 100 V120" class="ln" marker-end="url(#a)"/>
  <rect x="840" y="120" width="140" height="60" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="852" y="143" class="h">比较器</text>
  <text x="852" y="163" class="s">COUNT 达到 COMP</text>
  <path d="M810 174 H840" class="ln" marker-end="url(#a)"/>
  <path d="M850 120 V110 H725 V166" class="ln" marker-end="url(#a)"/>
  <text x="719" y="130" class="b" text-anchor="end">ZRET=1：计数器清零</text>

  <!-- overflow -->
  <rect x="840" y="226" width="140" height="64" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="852" y="249" class="h">溢出检测</text>
  <text x="852" y="269" class="s">0xFFFF → 0x0000</text>
  <path d="M810 240 H840" class="ln" marker-end="url(#a)"/>

  <!-- flags -->
  <rect x="1010" y="120" width="90" height="60" rx="8" class="mem"/>
  <text x="1022" y="143" class="h">EQUF</text>
  <text x="1022" y="163" class="s">需 CMPE=1</text>
  <path d="M980 150 H1010" class="ln" marker-end="url(#a)"/>
  <rect x="1010" y="226" width="90" height="64" rx="8" class="mem"/>
  <text x="1022" y="249" class="h">OVFF</text>
  <text x="1022" y="269" class="s">需 OVFE=1</text>
  <path d="M980 258 H1010" class="ln" marker-end="url(#a)"/>
  <text x="1012" y="206" class="s">MODE 位 11:10</text>
  <text x="1012" y="220" class="s">写 1 清零</text>

  <path d="M1100 150 H1112 V430 H1100" class="ln" marker-end="url(#a)"/>
  <path d="M1055 290 V400" class="ln" marker-end="url(#a)"/>

  <!-- edge / interrupt -->
  <rect x="860" y="400" width="240" height="60" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="872" y="423" class="h">边沿检测</text>
  <text x="872" y="443" class="s">EQUF 或 OVFF 由 0 变 1 时发出一次脉冲</text>
  <path d="M860 430 H820" class="ln" marker-end="url(#a)"/>

  <rect x="600" y="400" width="220" height="60" rx="8" class="ee"/>
  <text x="612" y="423" class="h">EE INTC</text>
  <text x="612" y="443" class="s">I_STAT 位 9+n（TIM0–TIM3）</text>
  <path d="M710 460 V500" class="ln" marker-end="url(#a)"/>
  <rect x="600" y="500" width="220" height="48" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="612" y="522" class="n">R5900 INT0</text>
  <text x="612" y="539" class="s">Cause.IP2，经 I_MASK 屏蔽</text>

  <!-- hold -->
  <rect x="330" y="400" width="210" height="72" rx="8" class="ext"/>
  <text x="342" y="422" class="h">T0/T1_HOLD</text>
  <text x="342" y="442" class="s">SBUS 中断时锁存 COUNT</text>
  <text x="342" y="458" class="s">仅 T0、T1；QEMU 未实现</text>
  <path d="M680 250 V375 H435 V400" class="dl" marker-end="url(#g)"/>

  <!-- legend -->
  <rect x="24" y="500" width="28" height="16" rx="3" class="blk" stroke="#2f6fb2"/>
  <text x="60" y="513" class="s">实线：QEMU 已实现</text>
  <rect x="24" y="526" width="28" height="16" rx="3" class="ext"/>
  <text x="60" y="539" class="s">虚线：QEMU 未实现（门控、HOLD 锁存）</text>
</svg>
