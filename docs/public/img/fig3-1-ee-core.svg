<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 3-1 R5900 核心内部框图</text>

  <rect x="24" y="52" width="952" height="530" rx="14" class="ee"/>
  <text x="44" y="78" class="h">R5900 核心（EE Core）</text>
  <text x="240" y="78" class="s">294.912 MHz，双发射，6 级流水线</text>

  <!-- row 1: fetch -->
  <rect x="44" y="92" width="200" height="64" rx="8" class="blk" stroke="#c07a1a"/>
  <text x="56" y="114" class="h">指令缓存</text>
  <text x="56" y="134" class="s">16 KB，2 路组相联</text>
  <text x="56" y="148" class="s">行长 64 字节</text>

  <rect x="264" y="92" width="300" height="64" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="276" y="114" class="h">取指与发射</text>
  <text x="276" y="134" class="s">每周期取 2 条指令，成对发射</text>
  <text x="276" y="148" class="s">分支预测表，分支延迟槽</text>
  <path d="M244 124 H264" class="ln" marker-end="url(#a)"/>

  <rect x="584" y="92" width="372" height="64" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="596" y="114" class="h">通用寄存器 GPR 32 × 128 位</text>
  <text x="596" y="134" class="s">LO/HI 各 128 位：低 64 位为 LO/HI，高 64 位为 LO1/HI1</text>
  <text x="596" y="148" class="s">SA：QFSRV 移位量寄存器</text>

  <!-- issue line -->
  <path d="M414 156 V176" class="ln"/>
  <line x1="129" y1="176" x2="834" y2="176" class="ln"/>
  <path d="M129 176 V190" class="ln" marker-end="url(#a)"/>
  <path d="M311 176 V190" class="ln" marker-end="url(#a)"/>
  <path d="M483 176 V190" class="ln" marker-end="url(#a)"/>
  <path d="M640 176 V190" class="ln" marker-end="url(#a)"/>
  <path d="M834 176 V190" class="ln" marker-end="url(#a)"/>

  <!-- row 2: execution units -->
  <rect x="44" y="190" width="170" height="100" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="212" class="h">I0 整数流水线</text>
  <text x="56" y="232" class="s">ALU、移位、乘除</text>
  <text x="56" y="248" class="s">MMI 的低 64 位</text>
  <text x="56" y="264" class="s">MULT/DIV 写 LO/HI</text>

  <rect x="226" y="190" width="170" height="100" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="238" y="212" class="h">I1 整数流水线</text>
  <text x="238" y="232" class="s">ALU、移位</text>
  <text x="238" y="248" class="s">MULT1/DIV1 写 LO1/HI1</text>
  <text x="238" y="264" class="s">MMI 的高 64 位</text>

  <rect x="408" y="190" width="150" height="100" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="420" y="212" class="h">访存单元</text>
  <text x="420" y="232" class="s">LB…LD、LQ/SQ</text>
  <text x="420" y="248" class="s">128 位读写</text>
  <text x="420" y="264" class="s">LQC2/SQC2</text>

  <rect x="570" y="190" width="130" height="100" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="582" y="212" class="h">分支单元</text>
  <text x="582" y="232" class="s">跳转、分支</text>
  <text x="582" y="248" class="s">BC0T/BC0F</text>
  <text x="582" y="264" class="s">（CPCOND0）</text>

  <rect x="712" y="190" width="244" height="100" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="724" y="212" class="h">COP0 系统控制</text>
  <text x="724" y="232" class="s">TLB 48 项，S 位映射 SPR</text>
  <text x="724" y="248" class="s">异常、Status/Cause/EPC</text>
  <text x="724" y="264" class="s">Count/Compare 定时器、EI/DI</text>

  <rect x="44" y="302" width="352" height="26" rx="5" fill="#dbe8f8" stroke="#2f6fb2"/>
  <text x="220" y="319" text-anchor="middle" class="s">MMI：I0 与 I1 合用，按 128 位整数 SIMD 执行</text>

  <!-- LS to D$ and SPR -->
  <path d="M483 290 V340 H881 V350" class="ln" marker-end="url(#a)"/>
  <path d="M715 340 V350" class="ln" marker-end="url(#a)"/>
  <path d="M930 290 V350" class="ln" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="936" y="326" class="b">S</text>

  <!-- row 3: coprocessors and data memories -->
  <rect x="44" y="352" width="260" height="98" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="374" class="h">COP1 浮点单元</text>
  <text x="56" y="394" class="s">FPR 32 × 32 位，累加器 ACC</text>
  <text x="56" y="410" class="s">仅单精度，向零舍入</text>
  <text x="56" y="426" class="s">无 NaN、无穷大与非规格化数</text>

  <rect x="320" y="352" width="300" height="98" rx="8" class="gfx"/>
  <text x="332" y="374" class="h">COP2：VU0 宏模式</text>
  <text x="332" y="394" class="s">VF 32 × 128 位，VI 16 × 16 位</text>
  <text x="332" y="410" class="s">QMFC2/QMTC2、CFC2/CTC2、VCALLMS</text>
  <text x="332" y="426" class="s">实体为 VPU0 中的 VU0（第 7 章）</text>

  <rect x="640" y="352" width="150" height="98" rx="8" class="mem"/>
  <text x="652" y="374" class="h">数据缓存</text>
  <text x="652" y="394" class="n">8 KB</text>
  <text x="652" y="412" class="s">2 路组相联，写回</text>
  <text x="652" y="428" class="s">可锁定一路</text>

  <rect x="806" y="352" width="150" height="98" rx="8" class="mem"/>
  <text x="818" y="374" class="h">暂存存储器</text>
  <text x="818" y="394" class="n">SPR 16 KB</text>
  <text x="818" y="412" class="s">经 S 位 TLB 项访问</text>
  <text x="818" y="428" class="s">不在物理地址空间</text>

  <!-- row 4: buffers and bus interface -->
  <path d="M715 450 V490" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="44" y="490" width="220" height="70" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="512" class="h">写回缓冲 WBB</text>
  <text x="56" y="532" class="s">合并不缓存写与缓存行写回</text>
  <text x="56" y="548" class="s">按 FIFO 顺序送往总线</text>

  <rect x="280" y="490" width="220" height="70" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="292" y="512" class="h">不缓存加速缓冲 UCAB</text>
  <text x="292" y="532" class="s">C=7 页的读按块预取</text>
  <text x="292" y="548" class="s">加速顺序的不缓存读</text>

  <rect x="516" y="490" width="260" height="70" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="528" y="512" class="h">总线接口单元 BIU</text>
  <text x="528" y="532" class="s">128 位，缓存行填充、不缓存访问</text>
  <path d="M154 560 V578 H646 V560" class="ln" marker-end="url(#a)"/>
  <path d="M500 525 H516" class="ln" marker-end="url(#a)"/>

  <!-- main bus -->
  <line x1="56" y1="620" x2="944" y2="620" class="bus"/>
  <text x="60" y="648" class="b">EE 主总线 128 位：主存、DMAC、INTC、VPU、GIF 等（第 2 章）</text>
  <path d="M646 560 V614" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M881 450 V614" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="788" y="600" class="b">DMAC 通道 8/9</text>
</svg>
