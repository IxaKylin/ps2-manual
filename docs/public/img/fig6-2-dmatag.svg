<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 6-2 源链模式示例（通道 2，GIF）</text>
  <text x="24" y="58" class="s">主存中的 DMAtag 链表，地址自上而下递增；蓝色为 DMAtag，橙色为数据四字。</text>
  <rect x="150" y="100" width="300" height="28" fill="#eaf2fc" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="160" y="119" class="n">cnt  QWC=2</text>
  <text x="440" y="119" text-anchor="end" class="s">0x00100000</text>
  <rect x="150" y="128" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="147" class="n">D1</text>
  <rect x="150" y="156" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="175" class="n">D2</text>
  <rect x="150" y="184" width="300" height="28" fill="#eaf2fc" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="160" y="203" class="n">next  QWC=1  ADDR=B</text>
  <text x="440" y="203" text-anchor="end" class="s">0x00100030</text>
  <rect x="150" y="212" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="231" class="n">D3</text>
  <rect x="150" y="300" width="300" height="28" fill="#eaf2fc" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="160" y="319" class="n">ref  QWC=3  ADDR=C</text>
  <text x="440" y="319" text-anchor="end" class="s">B = 0x00200000</text>
  <rect x="150" y="328" width="300" height="28" fill="#eaf2fc" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="160" y="347" class="n">end  QWC=0</text>
  <text x="440" y="347" text-anchor="end" class="s">0x00200010</text>
  <rect x="150" y="420" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="439" class="n">C1</text>
  <text x="440" y="439" text-anchor="end" class="s">C = 0x00300000</text>
  <rect x="150" y="448" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="467" class="n">C2</text>
  <rect x="150" y="476" width="300" height="28" fill="#fdf0dc" stroke="#c07a1a" stroke-width="1.5"/>
  <text x="160" y="495" class="n">C3</text>
  <text x="40" y="118" class="b">D2_TADR</text>
  <path d="M96 114 H148" class="ln" marker-end="url(#a)"/>
  <path d="M450 114 H476 V198 H452" class="ln" marker-end="url(#a)"/>
  <text x="484" y="152" class="s">cnt：数据紧跟标签，</text>
  <text x="484" y="168" class="s">下一标签紧跟数据</text>
  <path d="M150 198 H120 V314 H148" class="ln" marker-end="url(#a)"/>
  <text x="128" y="268" class="s">next：下一标签在 ADDR</text>
  <path d="M450 314 H476 V434 H452" class="ln" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="484" y="346" class="s">end：本块传完后结束</text>
  <text x="484" y="384" class="s">ref：数据取自 ADDR，</text>
  <text x="484" y="400" class="s">下一标签为 TADR + 16</text>
  <rect x="640" y="90" width="296" height="150" rx="10" class="ee"/>
  <text x="656" y="114" class="h">DMAtag 低 64 位</text>
  <text x="656" y="138" class="s">15:0</text>
  <text x="704" y="138" class="b">QWC</text>
  <text x="748" y="138" class="s">数据块四字数</text>
  <text x="656" y="158" class="s">30:28</text>
  <text x="704" y="158" class="b">ID</text>
  <text x="748" y="158" class="s">标签类型</text>
  <text x="656" y="178" class="s">31</text>
  <text x="704" y="178" class="b">IRQ</text>
  <text x="748" y="178" class="s">与 CHCR.TIE 配合结束传输</text>
  <text x="656" y="198" class="s">62:32</text>
  <text x="704" y="198" class="b">ADDR</text>
  <text x="748" y="198" class="s">数据或下一标签的地址</text>
  <text x="656" y="218" class="s">63</text>
  <text x="704" y="218" class="b">SPR</text>
  <text x="748" y="218" class="s">为 1 时地址指向 SPR</text>
  <rect x="640" y="420" width="296" height="84" rx="10" class="ee"/>
  <text x="656" y="444" class="h">结束后</text>
  <text x="656" y="466" class="s">D2_CHCR.STR = 0，D2_QWC = 0</text>
  <text x="656" y="486" class="s">D_STAT.CIS2 = 1，CIM2 = 1 时产生 INT1</text>
  <text x="150" y="540" class="b">送往 GIF 的四字顺序（TTE = 0）</text>
  <rect x="150" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="180" y="572" text-anchor="middle" class="n">D1</text>
  <path d="M210 567 H218" class="ln"/>
  <rect x="218" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="248" y="572" text-anchor="middle" class="n">D2</text>
  <path d="M278 567 H286" class="ln"/>
  <rect x="286" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="316" y="572" text-anchor="middle" class="n">D3</text>
  <path d="M346 567 H354" class="ln"/>
  <rect x="354" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="384" y="572" text-anchor="middle" class="n">C1</text>
  <path d="M414 567 H422" class="ln"/>
  <rect x="422" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="452" y="572" text-anchor="middle" class="n">C2</text>
  <path d="M482 567 H490" class="ln"/>
  <rect x="490" y="552" width="60" height="30" rx="5" class="mem"/>
  <text x="520" y="572" text-anchor="middle" class="n">C3</text>
  <path d="M560 567 H638" class="ln" marker-end="url(#a)"/>
  <rect x="640" y="552" width="120" height="30" rx="5" class="gfx"/>
  <text x="700" y="572" text-anchor="middle" class="n">GIF（PATH3）</text>
</svg>
