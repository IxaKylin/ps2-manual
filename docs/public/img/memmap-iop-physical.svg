xt x="494" y="248" class="d">SSBUS、INTC、DMA 两组、根计数器 0–5、ICFG、DEV9、USB…</text><rect x="180" y="260" width="300" height="34" fill="#eeeeee" stroke="#8a8f96" stroke-width="1.2" stroke-dasharray="4 3"/><text x="330" y="282" text-anchor="middle" class="n">IOP 暂存存储器</text><text x="170" y="272" text-anchor="end" class="a">0x1F8003FF</text><text x="170" y="291" text-anchor="end" class="a">0x1F800000</text><rect x="180" y="294" width="300" height="34" fill="#dbe8f8" stroke="#2f6fb2" stroke-width="1.2"/><text x="330" y="316" text-anchor="middle" class="n">CDVD / MechaCon</text><text x="170" y="306" text-anchor="end" class="a">0x1F4020FF</text><text x="170" y="325" text-anchor="end" class="a">0x1F402000</text><rect x="180" y="328" width="300" height="34" fill="#f6d6d6" stroke="#b04848" stroke-width="1.2"/><text x="330" y="350" text-anchor="middle" class="n">ROM2</text><text x="170" y="340" text-anchor="end" class="a">0x1E7FFFFF</text><text x="170" y="359" text-anchor="end" class="a">0x1E400000</text><rect x="180" y="362" width="300" height="34" fill="#f6d6d6" stroke="#b04848" stroke-width="1.2"/><text x="330" y="384" text-anchor="middle" class="n">ROM1</text><text x="170" y="374" text-anchor="end" class="a">0x1E3FFFFF</text><text x="170" y="393" text-anchor="end" class="a">0x1E000000</text><rect x="180" y="396" width="300" height="34" fill="#dbe8f8" stroke="#2f6fb2" stroke-width="1.2"/><text x="330" y="418" text-anchor="middle" class="n">SIF（IOP 侧）</text><text x="170" y="408" text-anchor="end" class="a">0x1D0000FF</text><text x="170" y="427" text-anchor="end" class="a">0x1D000000</text><rect x="180" y="430" width="300" height="34" fill="#eeeeee" stroke="#8a8f96" stroke-width="1.2" stroke-dasharray="4 3"/><text x="330" y="452" text-anchor="middle" class="n">DEV9 扩展窗口</text><text x="170" y="442" text-anchor="end" class="a">0x161FFFFF</text><text x="170" y="461" text-anchor="end" class="a">0x16000000</text><rect x="180" y="464" width="300" height="34" fill="#dbe8f8" stroke="#2f6f