<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 7-1 VPU0 与 VPU1 的内部结构</text>
  <text x="24" y="58" class="s">箭头表示数据流向；VU1 比 VU0 多出 EFU、XGKICK 与 PATH2，存储器也更大。</text>

  <!-- R5900 -->
  <rect x="24" y="90" width="210" height="80" rx="10" class="ee"/>
  <text x="38" y="114" class="h">R5900（EE 核心）</text>
  <text x="38" y="136" class="s">CFC2/CTC2、QMFC2/QMTC2</text>
  <text x="38" y="154" class="s">宏指令、VCALLMS、CMSAR1</text>

  <!-- DMAC -->
  <rect x="24" y="330" width="210" height="90" rx="10" class="ee"/>
  <text x="38" y="354" class="h">DMAC</text>
  <text x="38" y="378" class="s">ch0 → VIF0 FIFO</text>
  <text x="38" y="398" class="s">ch1 ⇄ VIF1 FIFO（由 DIR 选择）</text>

  <!-- VPU0 -->
  <rect x="290" y="80" width="510" height="240" rx="14" class="gfx"/>
  <text x="306" y="104" class="h">VPU0</text>
  <text x="300" y="121" class="s">COP2（宏模式）</text>
  <path d="M236 128 H448" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="306" y="150" width="120" height="80" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="318" y="172" class="h">VIF0</text>
  <text x="318" y="194" class="s">FIFO 8 个四字</text>
  <text x="318" y="212" class="s">VIFcode 译码</text>

  <rect x="450" y="115" width="340" height="195" rx="10" class="blk" stroke="#7a4bb3"/>
  <text x="462" y="136" class="h">VU0</text>
  <rect x="462" y="145" width="150" height="60" rx="6" class="ee"/>
  <text x="474" y="168" class="n">上部单元</text>
  <text x="474" y="190" class="s">FMAC × 4（x、y、z、w）</text>
  <rect x="624" y="145" width="154" height="60" rx="6" class="ee"/>
  <text x="636" y="168" class="n">下部单元</text>
  <text x="636" y="190" class="s">FDIV、整数、分支、LSU</text>
  <rect x="462" y="213" width="316" height="26" rx="5" class="blk" stroke="#7a4bb3"/>
  <text x="472" y="231" class="s">VF × 32（128 位）、VI × 16（16 位）、ACC、I、Q、R</text>
  <rect x="462" y="250" width="150" height="40" rx="6" class="mem"/>
  <text x="472" y="266" class="s">微程序存储器 4 KB</text>
  <text x="472" y="282" class="s">EE 0x11000000</text>
  <rect x="624" y="250" width="154" height="40" rx="6" class="mem"/>
  <text x="634" y="266" class="s">数据存储器 4 KB</text>
  <text x="634" y="282" class="s">EE 0x11004000</text>

  <text x="427" y="184" class="b" style="font-size:10px">MPG</text>
  <path d="M426 190 H440 V270 H460" class="ln" marker-end="url(#a)"/>
  <text x="372" y="262" class="b">UNPACK</text>
  <path d="M366 230 V300 H700 V292" class="ln" marker-end="url(#a)"/>

  <path d="M234 350 H260 V190 H304" class="ln" marker-end="url(#a)"/>

  <!-- VPU1 -->
  <rect x="290" y="330" width="510" height="320" rx="14" class="gfx"/>
  <text x="306" y="354" class="h">VPU1</text>
  <text x="470" y="370" class="s">DIRECT / DIRECTHL（PATH2）</text>
  <path d="M390 420 V378 H838" class="ln" marker-end="url(#a)"/>

  <rect x="306" y="420" width="120" height="80" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="318" y="442" class="h">VIF1</text>
  <text x="318" y="464" class="s">FIFO 16 个四字</text>
  <text x="318" y="482" class="s">双缓冲 TOPS</text>

  <rect x="450" y="388" width="340" height="247" rx="10" class="blk" stroke="#7a4bb3"/>
  <text x="462" y="409" class="h">VU1</text>
  <rect x="462" y="418" width="150" height="60" rx="6" class="ee"/>
  <text x="474" y="441" class="n">上部单元</text>
  <text x="474" y="463" class="s">FMAC × 4（x、y、z、w）</text>
  <rect x="624" y="418" width="154" height="60" rx="6" class="ee"/>
  <text x="636" y="441" class="n">下部单元</text>
  <text x="636" y="463" class="s">FDIV、整数、分支、LSU</text>
  <rect x="462" y="486" width="150" height="28" rx="6" class="ee"/>
  <text x="474" y="505" class="s">EFU（仅 VU1）→ P</text>
  <rect x="624" y="486" width="154" height="28" rx="6" class="ee"/>
  <text x="636" y="505" class="s">XGKICK（仅 VU1）</text>
  <path d="M778 500 H815" class="ln"/>
  <rect x="462" y="522" width="316" height="26" rx="5" class="blk" stroke="#7a4bb3"/>
  <text x="472" y="540" class="s">VF × 32、VI × 16、ACC、I、Q、R、P</text>
  <rect x="462" y="556" width="150" height="40" rx="6" class="mem"/>
  <text x="472" y="572" class="s">微程序存储器 16 KB</text>
  <text x="472" y="588" class="s">EE 0x11008000</text>
  <rect x="624" y="556" width="154" height="40" rx="6" class="mem"/>
  <text x="634" y="572" class="s">数据存储器 16 KB</text>
  <text x="634" y="588" class="s">EE 0x1100C000</text>

  <text x="427" y="454" class="b" style="font-size:10px">MPG</text>
  <path d="M426 460 H440 V576 H460" class="ln" marker-end="url(#a)"/>
  <text x="372" y="560" class="b">UNPACK</text>
  <path d="M366 500 V614 H700 V598" class="ln" marker-end="url(#a)"/>

  <path d="M234 400 H270 V460 H304" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- GIF -->
  <rect x="840" y="350" width="100" height="120" rx="10" class="gfx"/>
  <text x="852" y="374" class="h">GIF</text>
  <text x="852" y="396" class="s">PATH1/2/3</text>
  <text x="852" y="414" class="s">仲裁后送 GS</text>
  <text x="852" y="432" class="s">（第 8 章）</text>
  <text x="852" y="454" class="s">PATH3：ch2</text>
  <path d="M778 576 H815 V450 H838" class="ln" marker-end="url(#a)"/>
  <text x="822" y="500" class="b">XGKICK</text>
  <text x="822" y="516" class="b">PATH1</text>

  <text x="24" y="676" class="s">VU0 微程序还可经 VU0 数据存储器地址 0x4000 起的窗口访问 VU1 的 VF/VI 寄存器（图中未画出）；R5900 经 CTC2 写 CMSAR1 可直接启动 VU1。</text>
</svg>
