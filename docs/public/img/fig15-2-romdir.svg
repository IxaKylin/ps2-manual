<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>

  <rect width="960" height="610" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 15-2 ROM0 布局与 ROMDIR</text>
  <text x="24" y="58" class="s">左：ROM0（物理地址 0x1FC00000 起）中各文件的排列，每个文件都从 16 字节边界开始；右：ROMDIR 项与 ROMVER 字符串的格式。</text>

  <!-- left: ROM0 column -->
  <text x="110" y="84" class="h">ROM0（4 MB）</text>
  <rect x="110" y="94" width="240" height="126" class="ee"/>
  <text x="122" y="116" class="h">RESET</text>
  <text x="122" y="136" class="s">复位与引导代码，EE 与 IOP 共用</text>
  <text x="122" y="156" class="s">+0x0000：复位入口，读 PRId</text>
  <text x="122" y="174" class="s">+0x0800：EE 起点</text>
  <text x="122" y="192" class="s">+0x2000：IOP 起点</text>
  <text x="122" y="210" class="s">（两条启动路径相同）</text>

  <rect x="110" y="220" width="240" height="74" class="mem"/>
  <text x="122" y="242" class="h">ROMDIR</text>
  <text x="122" y="262" class="s">紧接 RESET 之后，16 字节对齐</text>
  <text x="122" y="280" class="s">SCPH-39001：0x1FC02740</text>

  <rect x="110" y="294" width="240" height="50" class="iop"/>
  <text x="122" y="315" class="h">EXTINFO</text>
  <text x="122" y="334" class="s">各文件的日期、版本、注释</text>

  <rect x="110" y="344" width="240" height="50" class="gfx"/>
  <text x="122" y="365" class="h">ROMVER</text>
  <text x="122" y="384" class="s">版本字符串，QEMU 读前 14 字节</text>

  <rect x="110" y="394" width="240" height="90" class="blk" stroke="#3a4250"/>
  <text x="122" y="416" class="h">其他文件</text>
  <text x="122" y="436" class="s">IOPBOOT、IOPBTCONF、EELOAD、</text>
  <text x="122" y="454" class="s">OSDSYS 与各 IOP 模块 …</text>
  <text x="122" y="472" class="s">种类、顺序与数量随 BIOS 版本而异</text>

  <rect x="110" y="484" width="240" height="40" class="ext"/>
  <text x="122" y="509" class="s">其余空间（ROM0 窗口共 4 MB）</text>

  <text x="102" y="100" text-anchor="end" class="s">+0</text>
  <text x="102" y="226" text-anchor="end" class="s">R</text>
  <text x="102" y="300" text-anchor="end" class="s">R + D</text>

  <!-- right: ROMDIR entry -->
  <text x="390" y="92" class="h">ROMDIR 项（16 字节，小端）</text>
  <text x="392" y="118" class="s">+0x00</text>
  <text x="722" y="118" class="s">+0x0A</text>
  <text x="788" y="118" class="s">+0x0C</text>
  <text x="918" y="118" text-anchor="end" class="s">+0x0F</text>
  <rect x="390" y="124" width="330" height="44" class="mem"/>
  <text x="555" y="151" text-anchor="middle" class="n">文件名（10 字节，不足补 0）</text>
  <rect x="720" y="124" width="66" height="44" class="iop"/>
  <text x="753" y="142" text-anchor="middle" class="s">EXTINFO</text>
  <text x="753" y="159" text-anchor="middle" class="s">大小</text>
  <rect x="786" y="124" width="132" height="44" class="ee"/>
  <text x="852" y="151" text-anchor="middle" class="n">文件大小（4 字节）</text>

  <line x1="350" y1="257" x2="390" y2="146" class="ln" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- example table -->
  <text x="390" y="200" class="h">例：ps2-lite-bios 的 ROMDIR</text>
  <rect x="390" y="210" width="540" height="26" fill="#f4f5f7" stroke="#8a8f96" stroke-width="1"/>
  <text x="398" y="228" class="b">文件名</text>
  <text x="508" y="228" class="b">EXTINFO</text>
  <text x="578" y="228" class="b">大小</text>
  <text x="688" y="228" class="b">内容</text>
  <rect x="390" y="236" width="540" height="182" fill="#ffffff" stroke="#8a8f96" stroke-width="1"/>
  <line x1="500" y1="210" x2="500" y2="418" stroke="#c4c8ce" stroke-width="1"/>
  <line x1="570" y1="210" x2="570" y2="418" stroke="#c4c8ce" stroke-width="1"/>
  <line x1="680" y1="210" x2="680" y2="418" stroke="#c4c8ce" stroke-width="1"/>
  <text x="398" y="254" class="s">RESET</text>
  <text x="508" y="254" class="s">0</text>
  <text x="578" y="254" class="s">ROMDIR 的偏移</text>
  <text x="688" y="254" class="s">ROMDIR 之前的全部代码</text>
  <text x="398" y="280" class="s">ROMDIR</text>
  <text x="508" y="280" class="s">0</text>
  <text x="578" y="280" class="s">0x70</text>
  <text x="688" y="280" class="s">ROMDIR 自身，6 项加结束项</text>
  <text x="398" y="306" class="s">EXTINFO</text>
  <text x="508" y="306" class="s">0</text>
  <text x="578" y="306" class="s">0</text>
  <text x="688" y="306" class="s">空</text>
  <text x="398" y="332" class="s">ROMVER</text>
  <text x="508" y="332" class="s">0</text>
  <text x="578" y="332" class="s">0x10</text>
  <text x="688" y="332" class="s">"0230EC20040614\n" 与结尾 0</text>
  <text x="398" y="358" class="s">IOPKERN</text>
  <text x="508" y="358" class="s">0</text>
  <text x="578" y="358" class="s">按构建结果</text>
  <text x="688" y="358" class="s">IOP 内核的 IRX 外壳</text>
  <text x="398" y="384" class="s">ADDDRV</text>
  <text x="508" y="384" class="s">0</text>
  <text x="578" y="384" class="s">按构建结果</text>
  <text x="688" y="384" class="s">不含代码的 IRX</text>
  <text x="398" y="410" class="s">（16 字节 0）</text>
  <text x="508" y="410" class="s">—</text>
  <text x="578" y="410" class="s">—</text>
  <text x="688" y="410" class="s">结束项</text>

  <!-- ROMVER format -->
  <text x="390" y="452" class="h">ROMVER 格式（例：0160AC20020207）</text>
  <rect x="390" y="462" width="144" height="44" class="ee"/>
  <text x="462" y="481" text-anchor="middle" class="n">0160</text>
  <text x="462" y="498" text-anchor="middle" class="s">版本 1.60</text>
  <rect x="534" y="462" width="36" height="44" class="iop"/>
  <text x="552" y="481" text-anchor="middle" class="n">A</text>
  <text x="552" y="498" text-anchor="middle" class="s">区域</text>
  <rect x="570" y="462" width="36" height="44" class="gfx"/>
  <text x="588" y="481" text-anchor="middle" class="n">C</text>
  <text x="588" y="498" text-anchor="middle" class="s">类别</text>
  <rect x="606" y="462" width="288" height="44" class="mem"/>
  <text x="750" y="481" text-anchor="middle" class="n">20020207</text>
  <text x="750" y="498" text-anchor="middle" class="s">日期（年、月、日）</text>
  <text x="390" y="524" class="s">字符 0–3：版本；字符 4：区域（J 日本、A 北美、E 欧洲、H 亚洲、C 中国等）；</text>
  <text x="390" y="540" class="s">字符 5：C 为零售机、D 为开发机；字符 6–13：日期。</text>

  <line x1="350" y1="369" x2="390" y2="484" class="ln" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <text x="24" y="568" class="s">文件的偏移 = 排在它前面的各文件大小分别按 16 字节向上取整后之和；RESET 的偏移为 0，因此 RESET 的大小（取整后）就是 ROMDIR 的偏移 R。</text>
  <text x="24" y="586" class="s">EXTINFO 紧接 ROMDIR 之后（D 为 ROMDIR 的大小）；某文件的附加信息在 EXTINFO 中的位置 = 排在它前面的各项 EXTINFO 大小之和。</text>
</svg>
