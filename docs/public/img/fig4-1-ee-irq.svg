<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" width="1120" height="670" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .thin{stroke:#3a4250;stroke-width:1.2;fill:none}
    .se{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:1.3}
    .sg{fill:#f1eafb;stroke:#7a4bb3;stroke-width:1.3}
    .si{fill:#e7f5ec;stroke:#2e8b57;stroke-width:1.3}
    .na{fill:#f4f5f7;stroke-dasharray:4 3}
    .reg{fill:#fdf0dc;stroke:#c07a1a;stroke-width:1.3}
    .gr{font-size:13px;fill:#8a8f96}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
    <!-- one row: arrow into I_STAT bit, AND gate, arrow into the OR -->
    <g id="row">
      <path d="M274 11 H320" class="thin" marker-end="url(#a)"/>
      <rect x="320" y="0" width="80" height="22" class="reg"/>
      <path d="M400 11 H440" class="thin" marker-end="url(#a)"/>
      <rect x="440" y="0" width="36" height="22" class="blk" stroke="#3a4250"/>
      <text x="458" y="16" text-anchor="middle" class="n">&amp;</text>
      <path d="M476 11 H520" class="thin" marker-end="url(#a)"/>
    </g>
  </defs>
  <rect width="1120" height="670" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 4-1 EE 中断路由</text>

  <text x="24" y="64" class="h">中断源</text>
  <text x="360" y="64" text-anchor="middle" class="h">I_STAT</text>
  <text x="458" y="64" text-anchor="middle" class="h">与</text>
  <text x="555" y="64" text-anchor="middle" class="h">或</text>

  <!-- 16 sources; dashed grey = not wired in QEMU -->
  <g transform="translate(0,76)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg"/><text x="34" y="16" class="n">GS（CSR &amp; ~IMR）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 0</text></g>
  <g transform="translate(0,102)"><rect x="24" y="0" width="250" height="22" rx="4" class="si"/><text x="34" y="16" class="n">SBUS（IOP 写 ICFG 位 1）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 1</text></g>
  <g transform="translate(0,128)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg"/><text x="34" y="16" class="n">VBON 场消隐开始</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 2</text></g>
  <g transform="translate(0,154)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg"/><text x="34" y="16" class="n">VBOF 场消隐结束</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 3</text></g>
  <g transform="translate(0,180)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">VIF0（VIFcode i 位）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 4</text></g>
  <g transform="translate(0,206)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">VIF1（VIFcode i 位）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 5</text></g>
  <g transform="translate(0,232)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">VU0（D/T 位）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 6</text></g>
  <g transform="translate(0,258)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">VU1（D/T 位）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 7</text></g>
  <g transform="translate(0,284)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">IPU</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 8</text></g>
  <g transform="translate(0,310)"><rect x="24" y="0" width="250" height="22" rx="4" class="se"/><text x="34" y="16" class="n">TIM0 定时器 0</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 9</text></g>
  <g transform="translate(0,336)"><rect x="24" y="0" width="250" height="22" rx="4" class="se"/><text x="34" y="16" class="n">TIM1 定时器 1</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 10</text></g>
  <g transform="translate(0,362)"><rect x="24" y="0" width="250" height="22" rx="4" class="se"/><text x="34" y="16" class="n">TIM2 定时器 2</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 11</text></g>
  <g transform="translate(0,388)"><rect x="24" y="0" width="250" height="22" rx="4" class="se"/><text x="34" y="16" class="n">TIM3 定时器 3</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 12</text></g>
  <g transform="translate(0,414)"><rect x="24" y="0" width="250" height="22" rx="4" class="se na"/><text x="34" y="16" class="gr">SFIFO 串口 FIFO</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 13</text></g>
  <g transform="translate(0,440)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">VU0WD 看门狗</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 14</text></g>
  <g transform="translate(0,466)"><rect x="24" y="0" width="250" height="22" rx="4" class="sg na"/><text x="34" y="16" class="gr">PGPU（PS1 模式）</text><use href="#row"/><text x="360" y="16" text-anchor="middle" class="n">位 15</text></g>

  <!-- OR of the 16 masked bits -->
  <rect x="520" y="76" width="70" height="412" rx="8" class="blk" stroke="#3a4250"/>
  <text x="555" y="270" text-anchor="middle" class="h">或</text>
  <text x="555" y="292" text-anchor="middle" class="s">16 路</text>

  <!-- I_MASK feeds every AND gate -->
  <rect x="410" y="512" width="96" height="40" rx="4" class="reg"/>
  <text x="458" y="529" text-anchor="middle" class="n">I_MASK</text>
  <text x="458" y="545" text-anchor="middle" class="s">写 1 翻转</text>
  <path d="M458 512 V490" class="ln" marker-end="url(#a)"/>
  <text x="464" y="504" class="b">16 位</text>
  <text x="320" y="508" class="s">上升沿置位</text>
  <text x="320" y="522" class="s">写 1 清零</text>

  <!-- legend -->
  <rect x="24" y="510" width="28" height="16" rx="3" class="sg na"/>
  <text x="60" y="523" class="s">虚线框：QEMU 未接入，永不置位</text>
  <rect x="24" y="536" width="28" height="16" rx="3" class="sg"/>
  <text x="60" y="549" class="s">GS / VPU / IPU 一侧</text>
  <rect x="24" y="562" width="28" height="16" rx="3" class="si"/>
  <text x="60" y="575" class="s">IOP 一侧（经 SBUS）</text>
  <rect x="24" y="588" width="28" height="16" rx="3" class="se"/>
  <text x="60" y="601" class="s">EE 片上外设</text>

  <!-- INT0 -->
  <path d="M590 282 H700" class="ln" marker-end="url(#a)"/>
  <text x="604" y="274" class="b">INT0</text>

  <!-- DMAC -->
  <rect x="320" y="572" width="290" height="56" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="332" y="594" class="h">DMAC（第 6 章）</text>
  <text x="332" y="616" class="n">D_STAT：CIS &amp; CIM ≠ 0，或 BEIS</text>
  <path d="M610 600 H650 V372 H700" class="ln" marker-end="url(#a)"/>
  <text x="616" y="592" class="b">INT1</text>
  <text x="320" y="650" class="s">D_PCR.CPC 与 D_STAT.CIS 另外产生 CPCOND0，供 BC0T/BC0F 测试，不产生中断</text>

  <!-- R5900 -->
  <rect x="680" y="70" width="416" height="420" rx="14" class="ee"/>
  <text x="870" y="96" class="h">R5900 COP0</text>
  <text x="870" y="116" class="s">Cause / Status 中断位</text>

  <rect x="700" y="100" width="150" height="44" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="775" y="119" text-anchor="middle" class="n">Count = Compare</text>
  <text x="775" y="136" text-anchor="middle" class="s">COP0 定时器</text>
  <path d="M775 144 V168" class="ln" marker-end="url(#a)"/>

  <rect x="700" y="168" width="150" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="775" y="185" text-anchor="middle" class="n">Cause.IP7（位 15）</text>
  <text x="775" y="201" text-anchor="middle" class="s">COP0 定时器</text>
  <path d="M850 188 H866" class="thin" marker-end="url(#a)"/>
  <rect x="866" y="168" width="104" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="918" y="193" text-anchor="middle" class="n">&amp; Status.IM7</text>
  <path d="M970 188 H990" class="thin" marker-end="url(#a)"/>

  <rect x="700" y="262" width="150" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="775" y="279" text-anchor="middle" class="n">Cause.IP2（位 10）</text>
  <text x="775" y="295" text-anchor="middle" class="s">INT0 ← INTC</text>
  <path d="M850 282 H866" class="thin" marker-end="url(#a)"/>
  <rect x="866" y="262" width="104" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="918" y="287" text-anchor="middle" class="n">&amp; Status.IM2</text>
  <path d="M970 282 H990" class="thin" marker-end="url(#a)"/>

  <rect x="700" y="352" width="150" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="775" y="369" text-anchor="middle" class="n">Cause.IP3（位 11）</text>
  <text x="775" y="385" text-anchor="middle" class="s">INT1 ← DMAC</text>
  <path d="M850 372 H866" class="thin" marker-end="url(#a)"/>
  <rect x="866" y="352" width="104" height="40" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="918" y="377" text-anchor="middle" class="n">&amp; Status.IM3</text>
  <path d="M970 372 H990" class="thin" marker-end="url(#a)"/>

  <rect x="990" y="168" width="90" height="224" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="1035" y="226" text-anchor="middle" class="h">或</text>
  <text x="1035" y="262" text-anchor="middle" class="n">&amp; IE</text>
  <text x="1035" y="284" text-anchor="middle" class="n">&amp; EIE</text>
  <text x="1035" y="306" text-anchor="middle" class="n">&amp; !EXL</text>
  <text x="1035" y="328" text-anchor="middle" class="n">&amp; !ERL</text>
  <path d="M1035 392 V428" class="ln" marker-end="url(#a)"/>

  <rect x="700" y="428" width="380" height="48" rx="6" class="blk" stroke="#2f6fb2"/>
  <text x="712" y="448" class="n">中断异常：Cause.ExcCode = 0</text>
  <text x="712" y="467" class="n">BEV=0 跳转 0x80000200，BEV=1 跳转 0xBFC00400</text>
</svg>
