<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 8-1 GIF 的三条 PATH</text>
  <text x="24" y="58" class="s">虚线框表示 QEMU 未模拟：QEMU 中三条 PATH 的数据按到达顺序直接送入同一个包解析器。</text>

  <!-- sources -->
  <rect x="24" y="90" width="220" height="70" rx="10" class="gfx"/>
  <text x="40" y="114" class="h">VU1</text>
  <text x="40" y="136" class="n">XGKICK 指令</text>
  <text x="40" y="153" class="s">数据取自 VU1 数据存储器</text>

  <rect x="24" y="200" width="220" height="70" rx="10" class="gfx"/>
  <text x="40" y="224" class="h">VIF1</text>
  <text x="40" y="246" class="n">DIRECT / DIRECTHL</text>
  <text x="40" y="263" class="s">VIFcode 之后的数据</text>

  <rect x="24" y="310" width="220" height="70" rx="10" class="ee"/>
  <text x="40" y="334" class="h">DMAC 通道 2</text>
  <text x="40" y="356" class="s">主存 → GIF，0x1000A000</text>
  <text x="40" y="372" class="s">见第 6 章</text>

  <rect x="24" y="420" width="220" height="70" rx="10" class="ee"/>
  <text x="40" y="444" class="h">R5900</text>
  <text x="40" y="466" class="s">SQ 写入 GIF FIFO 窗口</text>
  <text x="40" y="482" class="s">0x10006000</text>

  <!-- GIF -->
  <rect x="300" y="76" width="440" height="460" rx="14" class="gfx"/>
  <text x="316" y="100" class="h">GIF（图形接口）</text>

  <rect x="420" y="110" width="290" height="150" rx="8" class="ext"/>
  <text x="436" y="136" class="h">PATH 仲裁</text>
  <text x="436" y="160" class="n">PATH1 &gt; PATH2 &gt; PATH3</text>
  <text x="436" y="184" class="s">在数据包（EOP）之间切换</text>
  <text x="436" y="204" class="s">IMT = 1 时 PATH3 的 IMAGE 数据可被切分</text>
  <text x="436" y="224" class="s">M3R / MSKPATH3 屏蔽 PATH3</text>
  <text x="436" y="246" class="b">QEMU 未模拟</text>

  <rect x="380" y="320" width="120" height="150" rx="6" class="blk" stroke="#7a4bb3"/>
  <text x="392" y="344" class="h">GIF FIFO</text>
  <text x="392" y="366" class="s">16 个四字</text>
  <text x="392" y="384" class="s">只用于 PATH3</text>
  <text x="392" y="410" class="s">QEMU：无深度，</text>
  <text x="392" y="426" class="s">写入立即处理</text>

  <rect x="540" y="320" width="170" height="150" rx="6" class="blk" stroke="#7a4bb3"/>
  <text x="556" y="344" class="h">GIF 数据包解析器</text>
  <text x="556" y="366" class="s">读 GIFtag，按 FLG 拆分</text>
  <text x="556" y="386" class="s">PACKED/REGLIST/IMAGE</text>
  <text x="556" y="406" class="s">A+D、PRE/PRIM</text>
  <text x="556" y="430" class="s">QEMU：三条 PATH</text>
  <text x="556" y="448" class="s">共用一个解析器</text>

  <rect x="320" y="488" width="390" height="34" rx="6" class="blk" stroke="#7a4bb3"/>
  <text x="332" y="510" class="s">GIF_CTRL / GIF_MODE / GIF_STAT …  基地址 0x10003000（8.6 节）</text>

  <!-- GS -->
  <rect x="800" y="320" width="136" height="150" rx="10" class="gfx"/>
  <text x="814" y="344" class="h">GS</text>
  <text x="814" y="368" class="n">一般寄存器</text>
  <text x="814" y="390" class="s">PRIM、RGBAQ、</text>
  <text x="814" y="408" class="s">ST、UV、XYZ2、</text>
  <text x="814" y="426" class="s">HWREG 等</text>
  <text x="814" y="450" class="s">（第 9 章）</text>

  <!-- connectors -->
  <path d="M244 125 H418" class="ln" marker-end="url(#a)"/>
  <text x="256" y="117" class="b">PATH1</text>
  <path d="M244 235 H418" class="ln" marker-end="url(#a)"/>
  <text x="256" y="227" class="b">PATH2</text>
  <path d="M244 345 H378" class="ln" marker-end="url(#a)"/>
  <text x="256" y="337" class="b">PATH3</text>
  <path d="M244 455 H378" class="ln" marker-end="url(#a)"/>
  <text x="256" y="447" class="b">PATH3</text>
  <path d="M440 320 V262" class="ln" marker-end="url(#a)"/>
  <text x="448" y="296" class="b">PATH3</text>
  <path d="M625 260 V318" class="ln" marker-end="url(#a)"/>
  <path d="M710 395 H798" class="ln" marker-end="url(#a)"/>
  <text x="750" y="387" class="b">64 位</text>
</svg>
