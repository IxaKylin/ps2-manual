" y="260" width="300" height="34" fill="#dbe8f8" stroke="#2f6fb2" stroke-width="1.2"/><text x="330" y="282" text-anchor="middle" class="n">DMAC 通道 0–9</text><text x="170" y="272" text-anchor="end" class="a">0x1000DFFF</text><text x="170" y="291" text-anchor="end" class="a">0x10008000</text><text x="494" y="282" class="d">VIF0、VIF1、GIF、IPU、SIF0–2、SPR</text><rect x="180" y="294" width="300" height="34" fill="#eeeeee" stroke="#8a8f96" stroke-width="1.2" stroke-dasharray="4 3"/><text x="330" y="316" text-anchor="middle" class="n">IPU FIFO</text><text x="170" y="306" text-anchor="end" class="a">0x10007FFF</text><text x="170" y="325" text-anchor="end" class="a">0x10007000</text><text x="494" y="316" class="d">未实现</text><rect x="180" y="328" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="350" text-anchor="middle" class="n">GIF FIFO</text><text x="170" y="340" text-anchor="end" class="a">0x10006FFF</text><text x="170" y="359" text-anchor="end" class="a">0x10006000</text><rect x="180" y="362" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="384" text-anchor="middle" class="n">VIF1 FIFO</text><text x="170" y="374" text-anchor="end" class="a">0x10005FFF</text><text x="170" y="393" text-anchor="end" class="a">0x10005000</text><rect x="180" y="396" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="418" text-anchor="middle" class="n">VIF0 FIFO</text><text x="170" y="408" text-anchor="end" class="a">0x10004FFF</text><text x="170" y="427" text-anchor="end" class="a">0x10004000</text><rect x="180" y="430" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="452" text-anchor="middle" class="n">VIF1 寄存器</text><text x="170" y="442" text-anchor="end" class="a">0x10003FFF</text><text x="170" y="461" text-anchor="end" class="a">0x10003C00</text><rect x="180" y="464" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="486" text-anchor="middle" class="n">VIF0 寄存器</text><text x="170" y="476" text-anchor="end" class="a">0x10003BFF</text><text x="170" y="495" text-anchor="end" class="a">0x10003800</text><rect x="180" y="498" width="300" height="34" fill="#e9defa" stroke="#7a4bb3" stroke-width="1.2"/><text x="330" y="520" text-anchor="middle" class="n">GIF 寄存器</text><text x="170" y="510" text-anchor="end" class="a">0x100030FF</text><text x="170" y="529" text-anchor="end" class="a">0x10003000</text><rect x="180" y="532" width="300" height="34" fill="#eeeeee" stroke="#8a8f96" stroke-width="1.2" stroke-dasharray="4 3"/><text x="330" y="554" text-anchor="middle" class="n">IPU 寄存器</text><text x="170" y="544" text-anchor="end" class="a">0x10002FFF</text><text x="170" y="563" text-anchor="end" class="a">0x10002000</text><text x="494" y="554" class="d">未实现</text><rect x="180" y="566" width="300" height="34" fill="#dbe8f8" stroke="#2f6fb2" stroke-width="1.2"/><text x="330" y="588" text-anchor="middle" class="n">定时器 T0–T3</text><text x="170" y="578" text-anchor="end" class="a">0x10001FFF</text><text x="170" y="597" text-anchor="end" class="a">0x10000000</text><text x="494" y="588" class="d">每个定时器间隔 0x800</text>
