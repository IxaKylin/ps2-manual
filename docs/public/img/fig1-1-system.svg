<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#1d2733}
    .h{font-size:15px;font-weight:700;fill:#1d2733}
    .n{font-size:13px;fill:#1d2733}
    .s{font-size:11px;fill:#4a5260}
    .b{font-size:11px;fill:#5a3d00;font-weight:600}
    .ee{fill:#eaf2fc;stroke:#2f6fb2;stroke-width:2}
    .gfx{fill:#f1eafb;stroke:#7a4bb3;stroke-width:2}
    .iop{fill:#e7f5ec;stroke:#2e8b57;stroke-width:2}
    .mem{fill:#fdf0dc;stroke:#c07a1a;stroke-width:2}
    .ext{fill:#f4f5f7;stroke:#8a8f96;stroke-width:1.5;stroke-dasharray:5 3}
    .blk{fill:#ffffff;stroke-width:1.3}
    .ln{stroke:#3a4250;stroke-width:2;fill:none}
    .bus{stroke:#2f6fb2;stroke-width:7;stroke-linecap:round}
    .ibus{stroke:#2e8b57;stroke-width:5;stroke-linecap:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect width="1120" height="760" fill="#ffffff"/>
  <text x="24" y="34" class="t">图 1-1 PlayStation 2 系统框图</text>

  <!-- Emotion Engine -->
  <rect x="24" y="56" width="640" height="370" rx="14" class="ee"/>
  <text x="44" y="82" class="h">Emotion Engine（EE）</text>
  <text x="250" y="82" class="s">294.912 MHz，主 CPU 与两个向量协处理器</text>

  <rect x="44" y="96" width="196" height="118" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="118" class="h">R5900 核心</text>
  <text x="56" y="138" class="n">MIPS III/IV 子集 + MMI</text>
  <text x="56" y="156" class="s">I 缓存 16 KB / D 缓存 8 KB</text>
  <text x="56" y="172" class="s">暂存存储器 SPR 16 KB</text>
  <text x="56" y="188" class="s">TLB 48 项，COP0</text>
  <rect x="150" y="194" width="84" height="16" rx="3" fill="#dbe8f8" stroke="#2f6fb2"/>
  <text x="192" y="206" text-anchor="middle" class="s">COP1 FPU</text>

  <rect x="256" y="96" width="186" height="118" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="268" y="118" class="h">VPU0</text>
  <text x="268" y="138" class="n">VU0 + VIF0</text>
  <text x="268" y="156" class="s">微程序 4 KB / 数据 4 KB</text>
  <text x="268" y="172" class="s">作为 COP2 宏指令执行，</text>
  <text x="268" y="188" class="s">或独立运行微程序</text>

  <rect x="458" y="96" width="186" height="118" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="470" y="118" class="h">VPU1</text>
  <text x="470" y="138" class="n">VU1 + VIF1 + EFU</text>
  <text x="470" y="156" class="s">微程序 16 KB / 数据 16 KB</text>
  <text x="470" y="172" class="s">几何运算，XGKICK</text>
  <text x="470" y="188" class="s">直接送 GIF（PATH1）</text>

  <path d="M240 200 H256" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="248" y="230" text-anchor="middle" class="b">COP2</text>

  <!-- main bus -->
  <line x1="56" y1="262" x2="632" y2="262" class="bus"/>
  <text x="160" y="252" class="b">EE 主总线 128 位</text>
  <path d="M142 214 V258" class="ln"/>
  <path d="M349 214 V258" class="ln"/>
  <path d="M551 214 V258" class="ln"/>

  <rect x="44" y="290" width="150" height="58" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="312" class="h">DMAC</text>
  <text x="56" y="332" class="s">10 通道，链式 DMA</text>
  <rect x="206" y="290" width="128" height="58" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="218" y="312" class="h">INTC / 定时器</text>
  <text x="218" y="332" class="s">16 个中断源</text>
  <text x="218" y="344" class="s">4 个定时器</text>
  <rect x="346" y="290" width="100" height="58" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="358" y="312" class="h">IPU</text>
  <text x="358" y="332" class="s">MPEG-2 解码</text>
  <rect x="458" y="290" width="186" height="58" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="470" y="312" class="h">GIF</text>
  <text x="470" y="332" class="s">PATH1/2/3 仲裁</text>
  <path d="M119 266 V290" class="ln"/>
  <path d="M270 266 V290" class="ln"/>
  <path d="M396 266 V290" class="ln"/>
  <path d="M551 266 V290" class="ln"/>

  <rect x="44" y="362" width="200" height="50" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="56" y="384" class="h">SIF（EE 侧）</text>
  <text x="56" y="402" class="s">DMAC 通道 5/6/7</text>
  <rect x="256" y="362" width="190" height="50" rx="8" class="blk" stroke="#2f6fb2"/>
  <text x="268" y="384" class="h">MCH / SIO</text>
  <text x="268" y="402" class="s">RDRAM 控制、调试串口</text>
  <path d="M119 348 V362" class="ln"/>
  <path d="M340 266 V362" class="ln"/>

  <!-- RDRAM -->
  <rect x="690" y="56" width="200" height="90" rx="12" class="mem"/>
  <text x="706" y="82" class="h">主存 RDRAM</text>
  <text x="706" y="104" class="n">32 MB，双通道</text>
  <text x="706" y="124" class="s">带宽约 3.2 GB/s</text>
  <path d="M664 120 H690" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- ROM -->
  <rect x="910" y="56" width="186" height="90" rx="12" class="mem"/>
  <text x="926" y="82" class="h">BIOS ROM</text>
  <text x="926" y="104" class="n">ROM0 4 MB</text>
  <text x="926" y="124" class="s">EE 与 IOP 共用</text>

  <!-- GS -->
  <rect x="690" y="176" width="406" height="250" rx="14" class="gfx"/>
  <text x="708" y="202" class="h">Graphics Synthesizer（GS）</text>
  <text x="945" y="202" class="s">147.456 MHz</text>
  <rect x="708" y="216" width="176" height="96" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="720" y="238" class="h">绘图引擎</text>
  <text x="720" y="258" class="s">16 条像素流水线</text>
  <text x="720" y="274" class="s">纹理、Alpha、Z、雾化</text>
  <text x="720" y="290" class="s">一般寄存器（经 GIF 写入）</text>
  <rect x="900" y="216" width="178" height="96" rx="8" class="blk" stroke="#c07a1a"/>
  <text x="912" y="238" class="h">本地存储器</text>
  <text x="912" y="258" class="n">eDRAM 4 MB</text>
  <text x="912" y="276" class="s">帧缓冲、Z 缓冲、纹理</text>
  <text x="912" y="292" class="s">内部总线 2560 位</text>
  <path d="M884 264 H900" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="708" y="328" width="176" height="80" rx="8" class="blk" stroke="#7a4bb3"/>
  <text x="720" y="350" class="h">PCRTC</text>
  <text x="720" y="370" class="s">两个读出电路，合成输出</text>
  <text x="720" y="386" class="s">特权寄存器 0x12000000</text>
  <rect x="900" y="328" width="178" height="80" rx="8" class="blk" stroke="#8a8f96"/>
  <text x="912" y="350" class="h">DVE</text>
  <text x="912" y="370" class="s">视频编码器</text>
  <text x="912" y="386" class="s">复合 / 色差 / RGB</text>
  <path d="M884 368 H900" class="ln" marker-end="url(#a)"/>
  <path d="M989 312 V328" class="ln"/>
  <path d="M644 319 H672 V260 H708" class="ln" marker-end="url(#a)"/>
  <text x="646" y="336" class="b">64 位</text>

  <!-- SIF link -->
  <path d="M144 412 V470" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="152" y="446" class="b">SIF：两个 128 字 FIFO，EE DMAC ⇄ IOP DMA</text>
  <path d="M1003 146 V160 H1104 V630 H1060" class="ln" stroke-dasharray="4 3"/>
  <text x="1098" y="458" text-anchor="end" class="s">ROM0</text>

  <!-- IOP -->
  <rect x="24" y="470" width="1060" height="270" rx="14" class="iop"/>
  <text x="44" y="496" class="h">I/O 处理器（IOP）</text>
  <text x="200" y="496" class="s">R3000A 36.864 MHz（PS1 模式 33.8688 MHz）</text>

  <rect x="44" y="510" width="200" height="96" rx="8" class="blk" stroke="#2e8b57"/>
  <text x="56" y="532" class="h">R3000A 核心</text>
  <text x="56" y="552" class="s">MIPS I，无 TLB，固定映射</text>
  <text x="56" y="568" class="s">KU/IE 三级堆栈，RFE</text>
  <text x="56" y="584" class="s">IsC 缓存隔离</text>
  <rect x="256" y="510" width="150" height="96" rx="8" class="blk" stroke="#c07a1a"/>
  <text x="268" y="532" class="h">IOP 内存</text>
  <text x="268" y="552" class="n">2 MB</text>
  <text x="268" y="570" class="s">EE 经 SBUS 可访问</text>
  <rect x="418" y="510" width="200" height="96" rx="8" class="blk" stroke="#2e8b57"/>
  <text x="430" y="532" class="h">IOP 系统外设</text>
  <text x="430" y="552" class="s">INTC（26 个中断源）</text>
  <text x="430" y="568" class="s">DMA 13 通道（两组）</text>
  <text x="430" y="584" class="s">根计数器 ×6、SSBUS</text>

  <line x1="56" y1="630" x2="1060" y2="630" class="ibus"/>
  <text x="852" y="622" class="b">IOP 总线 32 位 / SBUS</text>
  <path d="M144 606 V626" class="ln"/>
  <path d="M331 606 V626" class="ln"/>
  <path d="M518 606 V626" class="ln"/>

  <rect x="640" y="510" width="200" height="96" rx="8" class="blk" stroke="#2e8b57"/>
  <text x="652" y="532" class="h">SIF（IOP 侧）</text>
  <text x="652" y="552" class="s">IOP DMA 通道 9/10</text>
  <text x="652" y="568" class="s">MSCOM/SMCOM/标志寄存器</text>
  <path d="M740 606 V626" class="ln"/>

  <g>
    <rect x="44" y="650" width="160" height="72" rx="8" class="blk" stroke="#2e8b57"/>
    <text x="56" y="672" class="h">SIO2</text>
    <text x="56" y="690" class="s">手柄、存储卡</text>
    <text x="56" y="706" class="s">多分插适配器</text>
    <rect x="216" y="650" width="180" height="72" rx="8" class="blk" stroke="#2e8b57"/>
    <text x="228" y="672" class="h">CDVD / MechaCon</text>
    <text x="228" y="690" class="s">光驱、RTC、NVM</text>
    <text x="228" y="706" class="s">MagicGate 认证</text>
    <rect x="408" y="650" width="180" height="72" rx="8" class="blk" stroke="#2e8b57"/>
    <text x="420" y="672" class="h">SPU2</text>
    <text x="420" y="690" class="s">48 个声部，2 MB 声音存储器</text>
    <text x="420" y="706" class="s">ADPCM，混响</text>
    <rect x="600" y="650" width="160" height="72" rx="8" class="blk" stroke="#2e8b57"/>
    <text x="612" y="672" class="h">DEV9</text>
    <text x="612" y="690" class="s">扩展接口：ATA 硬盘</text>
    <text x="612" y="706" class="s">网络适配器</text>
    <rect x="772" y="650" width="140" height="72" rx="8" class="blk" stroke="#2e8b57"/>
    <text x="784" y="672" class="h">USB</text>
    <text x="784" y="690" class="s">OHCI，2 个端口</text>
    <rect x="924" y="650" width="140" height="72" rx="8" class="blk" stroke="#8a8f96"/>
    <text x="936" y="672" class="h">i.LINK</text>
    <text x="936" y="690" class="s">IEEE 1394</text>
    <text x="936" y="706" class="s">（早期型号）</text>
    <path d="M124 634 V650" class="ln"/>
    <path d="M306 634 V650" class="ln"/>
    <path d="M498 634 V650" class="ln"/>
    <path d="M680 634 V650" class="ln"/>
    <path d="M842 634 V650" class="ln"/>
    <path d="M994 634 V650" class="ln"/>
  </g>
</svg>
